name: dbt Tests

on:
  pull_request:
    paths:
      - 'dbt_project/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'

permissions:
  contents: read

jobs:
  dbt-test:
    runs-on: ubuntu-latest   # was [self-hosted, macOS, ARM64] — DuckDB :memory: needs no warehouse, so GitHub-hosted is free + safe on a public repo
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dbt_project

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          cd ..
          uv sync

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          healthcare_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ':memory:'
                threads: 4
          EOF

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Validate dbt project
        id: dbt_validate
        run: |
          uv run dbt parse 2>&1 | tee dbt_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbt-artifacts
          path: |
            dbt_project/target/manifest.json
            dbt_project/target/run_results.json
            dbt_project/dbt_output.log
          retention-days: 7
