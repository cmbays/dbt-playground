name: dbt Tests

on:
  pull_request:
    paths:
      - 'dbt_project/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'dbt_project/**'

jobs:
  dbt-test:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dbt_project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          cd ..
          uv sync

      - name: Setup dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          healthcare_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ':memory:'
                threads: 4
          EOF

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Validate dbt project
        id: dbt_validate
        run: |
          uv run dbt parse 2>&1 | tee dbt_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT


      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            dbt_project/target/manifest.json
            dbt_project/target/run_results.json
            dbt_project/dbt_output.log
          retention-days: 7
