# Phase 3: GitHub Project Management - Issue Template
#
# This template demonstrates batch issue creation for Phase 3.
# Use with: uv run scripts/github-ops.py issue batch docs/templates/issues/phase-3.yaml
#
# Validate with: uv run scripts/github-ops.py issue validate docs/templates/issues/phase-3.yaml

version: 1

# Default values applied to all issues in this template
defaults:
  milestone: v0.8
  labels: [workflow, phase-3]
  assignee: cmbays

issues:
  - title: "feat(github): implement issue creation CLI"
    description: |
      ## Description
      Enable PM to create GitHub issues programmatically via CLI without manual GitHub UI navigation.

      ## Acceptance Criteria
      - [ ] AC-1.1: Create single issues with `gh issue create`
      - [ ] AC-1.2: Create batch issues from YAML template
      - [ ] AC-1.3: Validate template syntax against JSON schema
      - [ ] AC-1.4: Related issues auto-linked via body syntax

      ## Implementation Notes
      - Use `gh issue create` for single issues
      - Python script `scripts/github-ops.py` for batch operations
      - JSON Schema validation: `docs/schemas/issue-template.schema.json`
      - Template format: YAML with defaults + issues array

      ## Related
      Closes #92
    labels: [enhancement, github-ops]
    priority: high

  - title: "feat(github): implement milestone tracking"
    description: |
      ## Description
      Create and track GitHub milestones (v0.8, v0.9, v1.0) with progress reporting.

      ## Acceptance Criteria
      - [ ] AC-2.1: Create milestones with due dates
      - [ ] AC-2.2: List all milestones with progress
      - [ ] AC-2.3: View detailed milestone status
      - [ ] AC-2.4: CLAUDE.md milestone status section updated

      ## Implementation Notes
      - Commands: create, list, status
      - Due dates in ISO 8601 format (YYYY-MM-DD)
      - Progress calculation: (closed / total) * 100
      - API: `gh api repos/{owner}/{repo}/milestones`

      ## Related
      Closes #93
    labels: [enhancement, github-ops]
    priority: high

  - title: "feat(github): enhanced PR-issue linking"
    description: |
      ## Description
      Enhance PR-issue linking with support for "Closes", "Fixes", "Resolves", "Related to" keywords.
      Automatic issue closure on PR merge via GitHub native linking.

      ## Acceptance Criteria
      - [ ] AC-3.1: PR-issue bidirectional linking works
      - [ ] AC-3.2: Issues auto-close on PR merge (for Closes/Fixes)
      - [ ] AC-3.3: Issues stay open for "Related to" links
      - [ ] AC-3.4: Syntax validation in pr-validation workflow

      ## Supported Syntax
      | Keyword | Behavior |
      |---------|----------|
      | `Closes #N` | Link + auto-close on merge |
      | `Fixes #N` | Link + auto-close on merge |
      | `Resolves #N` | Link + auto-close on merge |
      | `Related to #N` | Link only, no auto-close |
      | `See also #N` | Link in description |

      ## Related
      Closes #94
    labels: [enhancement, github-ops]
    priority: medium

  - title: "feat(github): GitHub Projects integration for v0.8"
    description: |
      ## Description
      Create GitHub Project "v0.8 Roadmap" with automated status transitions and issue management.

      ## Acceptance Criteria
      - [ ] AC-4.1: GitHub Project created for v0.8
      - [ ] AC-4.2: Issues auto-add to project when labeled
      - [ ] AC-4.3: Status columns: Backlog, In Progress, In Review, Done
      - [ ] AC-4.4: Auto-close issues when PR merged

      ## Automation Rules
      | Event | Action |
      |-------|--------|
      | Issue labeled "workflow" | Add to project |
      | Issue closed | Move to Done |
      | PR merged | Move to Done |

      ## GitHub Project Setup
      1. Create project in GitHub UI (main account > Projects)
      2. Add Status field: Backlog, In Progress, In Review, Done
      3. Configure built-in automation rules
      4. Add PROJECT_TOKEN secret to repository

      ## Related
      Closes #95
    labels: [enhancement, github-ops]
    priority: medium
