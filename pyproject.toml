[project]
name = "dbt-playground"
version = "0.7.0"
description = "dbt learning project for data transformation best practices, agent orchestration, and dbt-mcp integration"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.10.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "pre-commit>=3.7.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests across components",
    "slow: Tests that take longer to run",
    "smoke: Critical path tests for quick validation",
]

[tool.coverage.run]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
# Note: Coverage for FS1 scripts (log-session.py, consolidate-memory.py)
# is measured separately with --cov-fail-under flag

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function call in default argument
]

[tool.ruff.format]
quote-style = "single"
