name: Implementation Task
description: Specific development task as part of an Epic
title: "[Task] "
labels: ["type:task", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        ## Implementation Task Template
        Use this for specific development work that's part of a larger Epic.

  - type: input
    id: epic
    attributes:
      label: Parent Epic
      description: Issue number of parent Epic
      placeholder: "#147"
    validations:
      required: true

  - type: input
    id: prd-reference
    attributes:
      label: PRD Reference
      description: Link to related PRD document (for traceability)
      placeholder: docs/specs/PRD-029-GITHUB-INTEGRATION.md
    validations:
      required: false

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Target milestone for this task
      placeholder: v0.10
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Specific implementation work to be done
      placeholder: Create CODEOWNERS file with ownership patterns for all major directories
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How do we know this task is complete?
      placeholder: |
        - [ ] CODEOWNERS file created at .github/CODEOWNERS
        - [ ] All major directories have explicit owners
        - [ ] PR reviewer auto-assignment works
      render: markdown
    validations:
      required: true

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Implementation Notes
      description: Implementation approach, files to modify
      placeholder: |
        **Files to create/modify:**
        - `.github/CODEOWNERS` - New file with ownership patterns

        **Validation:**
        - `gh api repos/{owner}/{repo}/codeowners/errors`
      render: markdown

  - type: dropdown
    id: effort
    attributes:
      label: Effort Estimate
      description: How long will this take?
      options:
        - "XS (<2 hours)"
        - "S (<1 day)"
        - "M (1-3 days)"
        - "L (3-5 days)"
        - "XL (1+ weeks)"
    validations:
      required: true

  - type: textarea
    id: blockers
    attributes:
      label: Blocked By
      description: Other tasks that must be completed first
      placeholder: |
        - #XX - Dependency task

  - type: textarea
    id: testing
    attributes:
      label: Testing Plan
      description: How to verify this works
      placeholder: |
        **Integration tests:**
        - Open PR, verify reviewer auto-assigned

        **Manual testing:**
        - Create issue, verify task file created
      render: markdown

  - type: checkboxes
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: All must be checked before closing this issue
      options:
        - label: Code implemented and working
          required: true
        - label: Tests passing
          required: true
        - label: Documentation updated (if applicable)
          required: false
        - label: Code reviewed (if applicable)
          required: false
        - label: PR merged to main
          required: true
