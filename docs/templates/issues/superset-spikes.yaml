  - title: "spike: Priority Semaphore - Implementation Research & Gap Analysis"
    description: |
      ## Objective

      Understand how Superset implements fair queuing of concurrent operations, compare to our unlimited parallelism approach, and assess refactoring vs rebuild effort.

      ## Background

      From Superset research (RESEARCH_REPORT.md), their PrioritySemaphore limits concurrent PTY spawns:
      - 2 slots max for concurrent operations
      - Priority queue (active pane = priority 0, background = priority 1)
      - Prevents resource exhaustion (EMFILE errors)

      Our current approach has no concurrency limits on dbt operations.

      ## Research Questions

      1. How does Superset implement this? (code references, architecture)
         - `priority-semaphore.ts` (~100 lines)
         - Promise-based slot acquisition
      2. What tech stack do they use? Why those choices?
         - Promise-based semaphore, priority queue
      3. What have we tried implementing? (search our codebase)
         - `kanban/wip.py` - WIP limits exist (related concept)
         - `kanban/transitions.py` - transition guards
         - Supervisor orchestration logic
      4. What's the gap between fair queuing and our unlimited parallelism?
      5. Is this a refactoring opportunity (add queue to existing operations) or new work?
      6. How does this improve user experience?
         - Prevent resource exhaustion, predictable scheduling
      7. What's the minimal vertical slice to demonstrate value?
         - Queue dbt test commands only

      ## Deliverables

      - [ ] `PRIORITY_SEMAPHORE_DEEP_DIVE.md` in `temp/AGENT_REPORTS/superset-research/`
      - [ ] `GAP_ANALYSIS_PRIORITY_SEMAPHORE.md` (comparison + refactoring assessment)
      - [ ] User stories for feature planning

      ## Timeline

      1 week research + 1 day team synthesis

      ## Success Criteria

      - [ ] Clear understanding of Superset's approach
      - [ ] Clear understanding of our current patterns
      - [ ] Refactoring vs rebuild decision documented
      - [ ] Minimal viable user story written

      ## Related

      - Research: `temp/AGENT_REPORTS/superset-research/RESEARCH_REPORT.md`
      - Kanban WIP: `kanban/wip.py`
    labels: [spike, architecture, research, enhancement]
    priority: medium

  - title: "spike: Permission Routing - Implementation Research & Gap Analysis"
    description: |
      ## Objective

      Understand industry patterns for classifying operations as ALLOW/VALIDATE/ESCALATE, compare to our uniform access approach, and assess refactoring vs rebuild effort.

      ## Background

      From Integration Pathway (INTEGRATION_PATHWAY.md), we identified a gap in permission routing:
      - Currently all agents have same capabilities
      - No classification of operations by risk level
      - No approval workflow for sensitive operations

      Proposed classification:
      - ALLOW: Read operations, non-destructive writes
      - VALIDATE: Workflow transitions, worktree creation, PR creation
      - ESCALATE: Force push to main, delete worktrees, merge without review

      ## Research Questions

      1. How does Superset handle sensitive operations? (No direct equivalent - our innovation)
      2. What classification schemes exist in industry?
         - RBAC, ABAC, capability-based
         - Linux capability model
         - SELinux/AppArmor permission classes
         - AWS IAM action classification
      3. What have we tried implementing? (search our codebase)
         - `git-master.md` - git operation gating
         - `pre-bash-check.js` - command validation
         - ADR-022: Expedited Path Gating
      4. What's the gap between current uniform access and tiered permissions?
      5. Is this a refactoring opportunity (add checks to existing code) or new work?
      6. How does this improve user experience?
         - Safety for destructive operations, audit trail
      7. What's the minimal vertical slice to demonstrate value?
         - Classify git operations only

      ## Deliverables

      - [ ] `PERMISSION_ROUTING_DEEP_DIVE.md` in `temp/AGENT_REPORTS/superset-research/`
      - [ ] `GAP_ANALYSIS_PERMISSION_ROUTING.md` (comparison + refactoring assessment)
      - [ ] User stories for feature planning

      ## Timeline

      1 week research + 1 day team synthesis

      ## Success Criteria

      - [ ] Clear understanding of industry permission patterns
      - [ ] Clear understanding of our current patterns
      - [ ] Refactoring vs rebuild decision documented
      - [ ] Minimal viable user story written

      ## Related

      - Integration Pathway: `temp/AGENT_REPORTS/superset-research/INTEGRATION_PATHWAY.md`
      - ADR-022: `docs/decisions/ADR-022-expedited-path-gating.md`
      - Git-Master: `.claude/agents/git-master.md`
    labels: [spike, architecture, research, enhancement]
    priority: medium
