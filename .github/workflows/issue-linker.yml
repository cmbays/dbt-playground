name: Issue Linker

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-issue-link:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      pull-requests: read
      issues: read
    steps:
      - name: Check for linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Pattern for closing keywords (case-insensitive)
            // Closes, Close, Fixes, Fix, Resolves, Resolve
            const closingPattern = /(closes?|fixes?|resolves?)\s+#(\d+)/gi;

            // Pattern for non-closing keywords (case-insensitive)
            // Related to, See also
            const relatedPattern = /(related to|see also)\s+#(\d+)/gi;

            const closingMatches = [...body.matchAll(closingPattern)];
            const relatedMatches = [...body.matchAll(relatedPattern)];

            const closingIssues = closingMatches.map(m => ({
              keyword: m[1],
              number: m[2],
              type: 'closing'
            }));

            const relatedIssues = relatedMatches.map(m => ({
              keyword: m[1],
              number: m[2],
              type: 'related'
            }));

            const allIssues = [...closingIssues, ...relatedIssues];

            if (allIssues.length === 0) {
              core.setFailed('PR must reference at least one issue. Add "Closes #N", "Related to #N", or "See also #N" in the description.');
              return;
            }

            // Log categorized links
            if (closingIssues.length > 0) {
              console.log(`Closing issues: ${closingIssues.map(i => `#${i.number} (${i.keyword})`).join(', ')}`);
            }
            if (relatedIssues.length > 0) {
              console.log(`Related issues: ${relatedIssues.map(i => `#${i.number} (${i.keyword})`).join(', ')}`);
            }

            // Verify issues exist and check state
            const warnings = [];
            for (const issue of allIssues) {
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(issue.number)
                });

                // Warn if closing an already-closed issue
                if (issue.type === 'closing' && response.data.state === 'closed') {
                  warnings.push(`Issue #${issue.number} is already closed`);
                }
              } catch (e) {
                core.setFailed(`Issue #${issue.number} not found`);
                return;
              }
            }

            // Output warnings but don't fail
            if (warnings.length > 0) {
              console.log('\nWarnings:');
              warnings.forEach(w => console.log(`  - ${w}`));
            }

            console.log('\nAll linked issues verified');
