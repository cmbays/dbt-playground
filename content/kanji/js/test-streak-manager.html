<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streak Manager Tests (T2.4)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { color: #333; border-bottom: 2px solid #f97316; padding-bottom: 10px; }
    h2 { color: #555; margin-top: 30px; }
    .test-section {
      background: #f5f5f5;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .test-result {
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
    .pass {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
    }
    .fail {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
    }
    .info {
      background: #e7f3ff;
      color: #004085;
      border-left: 4px solid #0066cc;
    }
    .warning {
      background: #fff3cd;
      color: #856404;
      border-left: 4px solid #ffc107;
    }
    pre {
      background: #282c34;
      color: #abb2bf;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
    .summary {
      background: #333;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-top: 30px;
      text-align: center;
      font-size: 18px;
    }
    .summary.all-pass { background: #28a745; }
    .summary.has-fail { background: #dc3545; }
  </style>
</head>
<body>
  <h1>Streak Manager Tests (T2.4)</h1>
  <p>Testing <code>streak-manager.js</code> per TDD-003 §4 specifications.</p>

  <div id="results"></div>
  <div id="summary" class="summary"></div>

  <script src="streak-manager.js"></script>
  <script>
    const resultsDiv = document.getElementById('results');
    const summaryDiv = document.getElementById('summary');
    let passCount = 0;
    let failCount = 0;

    function log(message, status = 'info') {
      const div = document.createElement('div');
      div.className = 'test-result ' + status;

      if (status === 'pass') {
        div.textContent = '✓ ' + message;
        passCount++;
      } else if (status === 'fail') {
        div.textContent = '✗ ' + message;
        failCount++;
      } else if (status === 'warning') {
        div.textContent = '⚠ ' + message;
      } else {
        div.textContent = message;
      }

      resultsDiv.appendChild(div);
    }

    function section(title) {
      const h2 = document.createElement('h2');
      h2.textContent = title;
      resultsDiv.appendChild(h2);
    }

    function assertEqual(actual, expected, description) {
      if (actual === expected) {
        log(`${description}: ${actual} === ${expected}`, 'pass');
      } else {
        log(`${description}: got ${actual}, expected ${expected}`, 'fail');
      }
    }

    function assertTrue(value, description) {
      if (value) {
        log(`${description}: true`, 'pass');
      } else {
        log(`${description}: got false, expected true`, 'fail');
      }
    }

    function assertFalse(value, description) {
      if (!value) {
        log(`${description}: false`, 'pass');
      } else {
        log(`${description}: got true, expected false`, 'fail');
      }
    }

    function assertNotNull(value, description) {
      if (value !== null && value !== undefined) {
        log(`${description}: not null`, 'pass');
      } else {
        log(`${description}: got null/undefined`, 'fail');
      }
    }

    function assertNull(value, description) {
      if (value === null) {
        log(`${description}: null`, 'pass');
      } else {
        log(`${description}: got ${JSON.stringify(value)}, expected null`, 'fail');
      }
    }

    // Helper to create mock schema
    function createMockSchema(streakOverrides = {}) {
      return {
        stats: {
          streak: {
            current: 0,
            longest: 0,
            last_study_date: null,
            freezes_available: 0,
            freeze_used_date: null,
            freezes_earned_at: 0,
            ...streakOverrides
          }
        }
      };
    }

    // Helper to get date string for N days ago
    function daysAgo(n) {
      const date = new Date();
      date.setDate(date.getDate() - n);
      return StreakManager.getLocalDateString(date);
    }

    // ============================================
    // Test Suite
    // ============================================

    function runTests() {
      const today = StreakManager.getLocalDateString();
      const yesterday = daysAgo(1);
      const twoDaysAgo = daysAgo(2);
      const threeDaysAgo = daysAgo(3);

      // Test 1: Constants
      section('1. Constants Verification');
      assertEqual(StreakManager.MAX_FREEZES, 2, 'MAX_FREEZES');
      assertEqual(StreakManager.FREEZE_EARN_INTERVAL, 7, 'FREEZE_EARN_INTERVAL');
      assertEqual(StreakManager.AT_RISK_HOUR, 18, 'AT_RISK_HOUR');
      assertNotNull(StreakManager.MILESTONES[7], 'Has 7-day milestone');
      assertNotNull(StreakManager.MILESTONES[30], 'Has 30-day milestone');
      assertNotNull(StreakManager.MILESTONES[365], 'Has 365-day milestone');

      // Test 2: Date Utilities
      section('2. Date Utilities');
      log(`Today's date: ${today}`, 'info');
      log(`Yesterday's date: ${yesterday}`, 'info');

      assertTrue(StreakManager.isSameDay(today, today), 'Today is same as today');
      assertFalse(StreakManager.isSameDay(today, yesterday), 'Today is not same as yesterday');

      assertTrue(StreakManager.isNextDay(yesterday, today), 'Today is next day after yesterday');
      assertFalse(StreakManager.isNextDay(twoDaysAgo, today), 'Today is not next day after 2 days ago');
      assertFalse(StreakManager.isNextDay(today, yesterday), 'Yesterday is not next day after today');

      assertEqual(StreakManager.daysBetween(yesterday, today), 1, '1 day between yesterday and today');
      assertEqual(StreakManager.daysBetween(threeDaysAgo, today), 3, '3 days between 3 days ago and today');
      assertEqual(StreakManager.daysBetween(today, yesterday), -1, '-1 days between today and yesterday');

      // Test 3: First Study Ever (TDD-003 §4.3)
      section('3. updateStreak() - First Study Ever');
      let schema = createMockSchema({ last_study_date: null });
      let result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 1, 'First study sets streak to 1');
      assertTrue(result.streakIncreased, 'Streak increased flag set');
      assertFalse(result.streakBroken, 'Streak not broken');
      assertFalse(result.freezeUsed, 'No freeze used');
      assertEqual(result.schema.stats.streak.last_study_date, today, 'Last study date set to today');

      // Test 4: Same Day Study (TDD-003 §4.3)
      section('4. updateStreak() - Same Day Study');
      schema = createMockSchema({ current: 5, longest: 10, last_study_date: today });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 5, 'Streak unchanged on same day');
      assertFalse(result.streakIncreased, 'Streak not increased');
      assertFalse(result.streakBroken, 'Streak not broken');
      assertFalse(result.freezeUsed, 'No freeze used');

      // Test 5: Consecutive Day (TDD-003 §4.3)
      section('5. updateStreak() - Consecutive Day');
      schema = createMockSchema({ current: 5, longest: 10, last_study_date: yesterday });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 6, 'Streak incremented to 6');
      assertTrue(result.streakIncreased, 'Streak increased flag set');
      assertFalse(result.streakBroken, 'Streak not broken');
      assertEqual(result.schema.stats.streak.last_study_date, today, 'Last study date updated');

      // Test 6: Longest Streak Update
      section('6. updateStreak() - Longest Streak Update');
      schema = createMockSchema({ current: 10, longest: 10, last_study_date: yesterday });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.schema.stats.streak.current, 11, 'Current streak = 11');
      assertEqual(result.schema.stats.streak.longest, 11, 'Longest streak updated to 11');

      // Test 7: Gap of 1 Day with Freeze (TDD-003 §4.3)
      section('7. updateStreak() - 1 Day Gap with Freeze');
      schema = createMockSchema({
        current: 10,
        longest: 15,
        last_study_date: twoDaysAgo,
        freezes_available: 1
      });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 11, 'Streak continues: 11');
      assertTrue(result.freezeUsed, 'Freeze was used');
      assertFalse(result.streakBroken, 'Streak not broken');
      assertEqual(result.schema.stats.streak.freezes_available, 0, 'Freeze consumed');
      assertEqual(result.schema.stats.streak.freeze_used_date, today, 'Freeze used date recorded');

      // Test 8: Gap of 1 Day without Freeze (TDD-003 §4.3)
      section('8. updateStreak() - 1 Day Gap without Freeze');
      schema = createMockSchema({
        current: 10,
        longest: 15,
        last_study_date: twoDaysAgo,
        freezes_available: 0
      });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 1, 'Streak reset to 1');
      assertTrue(result.streakBroken, 'Streak was broken');
      assertFalse(result.freezeUsed, 'No freeze used (none available)');
      assertEqual(result.schema.stats.streak.longest, 15, 'Longest streak preserved');

      // Test 9: Gap of 2+ Days (TDD-003 §4.3)
      section('9. updateStreak() - 2+ Day Gap');
      schema = createMockSchema({
        current: 10,
        longest: 15,
        last_study_date: threeDaysAgo,
        freezes_available: 2 // Even with freezes, 2+ day gap breaks streak
      });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 1, 'Streak reset to 1');
      assertTrue(result.streakBroken, 'Streak was broken');
      assertFalse(result.freezeUsed, 'Freeze not used for 2+ day gap');
      assertEqual(result.schema.stats.streak.freezes_available, 2, 'Freezes preserved');

      // Test 10: Freeze Earning (TDD-003 §4.3)
      section('10. Freeze Earning at Day 7');
      schema = createMockSchema({
        current: 6,
        longest: 6,
        last_study_date: yesterday,
        freezes_available: 0,
        freezes_earned_at: 0
      });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 7, 'Streak = 7');
      assertEqual(result.schema.stats.streak.freezes_available, 1, 'Earned 1 freeze at day 7');
      assertEqual(result.schema.stats.streak.freezes_earned_at, 7, 'Recorded freeze earned at 7');

      // Test 11: Freeze Earning at Day 14
      section('11. Freeze Earning at Day 14');
      schema = createMockSchema({
        current: 13,
        longest: 13,
        last_study_date: yesterday,
        freezes_available: 1,
        freezes_earned_at: 7
      });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 14, 'Streak = 14');
      assertEqual(result.schema.stats.streak.freezes_available, 2, 'Now have 2 freezes');
      assertEqual(result.schema.stats.streak.freezes_earned_at, 14, 'Recorded freeze earned at 14');

      // Test 12: Freeze Cap at 2 (TDD-003 §4.3)
      section('12. Freeze Cap at 2');
      schema = createMockSchema({
        current: 20,
        longest: 20,
        last_study_date: yesterday,
        freezes_available: 2,
        freezes_earned_at: 14
      });
      result = StreakManager.updateStreak(schema);

      assertEqual(result.newStreak, 21, 'Streak = 21');
      assertEqual(result.schema.stats.streak.freezes_available, 2, 'Freezes capped at 2');

      // Test 13: Milestones
      section('13. Streak Milestones');
      assertNotNull(StreakManager.getStreakMilestone(7), 'Day 7 is milestone');
      assertNotNull(StreakManager.getStreakMilestone(30), 'Day 30 is milestone');
      assertNotNull(StreakManager.getStreakMilestone(365), 'Day 365 is milestone');
      assertNull(StreakManager.getStreakMilestone(8), 'Day 8 is not milestone');
      assertNull(StreakManager.getStreakMilestone(100), 'Day 100 is not milestone');

      // Test milestone returned on streak update
      schema = createMockSchema({
        current: 6,
        longest: 6,
        last_study_date: yesterday,
        freezes_available: 0
      });
      result = StreakManager.updateStreak(schema);
      assertNotNull(result.milestone, 'Milestone returned at day 7');
      assertEqual(result.milestone.title, 'One Week!', 'Correct milestone title');

      // Test 14: isStreakAtRisk (TDD-003 §4.3)
      section('14. isStreakAtRisk()');
      // Note: This test depends on current time. We'll test the logic.

      schema = createMockSchema({ current: 5, last_study_date: today });
      assertFalse(StreakManager.isStreakAtRisk(schema), 'Not at risk if studied today');

      schema = createMockSchema({ current: 0, last_study_date: yesterday });
      assertFalse(StreakManager.isStreakAtRisk(schema), 'Not at risk if streak is 0');

      // Time-dependent test - log current state
      schema = createMockSchema({ current: 5, last_study_date: yesterday });
      const atRisk = StreakManager.isStreakAtRisk(schema);
      const currentHour = new Date().getHours();
      log(`Current hour: ${currentHour}, At risk: ${atRisk} (expected ${currentHour >= 18})`, 'info');

      // Test 15: Time Until Streak Break
      section('15. getTimeUntilStreakBreak()');
      const timeRemaining = StreakManager.getTimeUntilStreakBreak();
      log(`Time until midnight: ${timeRemaining.formatted} (${timeRemaining.hours}h ${timeRemaining.minutes}m)`, 'info');
      assertTrue(timeRemaining.hours >= 0 && timeRemaining.hours <= 24, 'Hours within valid range');
      assertTrue(timeRemaining.minutes >= 0 && timeRemaining.minutes < 60, 'Minutes within valid range');

      // Test 16: Next Milestone
      section('16. getNextMilestone()');
      let nextMilestone = StreakManager.getNextMilestone(5);
      assertNotNull(nextMilestone, 'Has next milestone from day 5');
      assertEqual(nextMilestone.days, 7, 'Next milestone at day 7');
      assertEqual(nextMilestone.daysRemaining, 2, '2 days remaining');

      nextMilestone = StreakManager.getNextMilestone(100);
      assertNotNull(nextMilestone, 'Has next milestone from day 100');
      assertEqual(nextMilestone.days, 180, 'Next milestone at day 180');

      nextMilestone = StreakManager.getNextMilestone(365);
      assertNull(nextMilestone, 'No next milestone after 365');

      // Test 17: Achieved Milestones
      section('17. getAchievedMilestones()');
      let achieved = StreakManager.getAchievedMilestones(15);
      assertEqual(achieved.length, 2, '2 milestones achieved at day 15 (7 and 14)');

      achieved = StreakManager.getAchievedMilestones(100);
      assertEqual(achieved.length, 5, '5 milestones achieved at day 100');

      achieved = StreakManager.getAchievedMilestones(0);
      assertEqual(achieved.length, 0, '0 milestones at day 0');

      // Test 18: Display Helpers
      section('18. Display Helpers');
      assertEqual(StreakManager.formatStreakDays(1), '1 day', 'Format 1 day');
      assertEqual(StreakManager.formatStreakDays(5), '5 days', 'Format 5 days');

      let message = StreakManager.getMotivationalMessage(0);
      assertTrue(message.includes('Start'), 'Day 0 message includes Start');

      message = StreakManager.getMotivationalMessage(5);
      assertTrue(message.includes('freeze'), 'Day 5 message mentions freeze');

      message = StreakManager.getMotivationalMessage(50);
      assertTrue(message.length > 0, 'Day 50 has message');

      // Test 19: Streak Status
      section('19. getStreakStatus()');
      schema = createMockSchema({
        current: 10,
        longest: 15,
        last_study_date: today,
        freezes_available: 1
      });

      const status = StreakManager.getStreakStatus(schema);
      assertEqual(status.current, 10, 'Status current = 10');
      assertEqual(status.longest, 15, 'Status longest = 15');
      assertEqual(status.freezesAvailable, 1, 'Status freezesAvailable = 1');
      assertTrue(status.studiedToday, 'Status studiedToday = true');
      assertFalse(status.atRisk, 'Status atRisk = false (studied today)');
      assertNotNull(status.nextMilestone, 'Has next milestone');

      // Test 20: Legacy Migration
      section('20. migrateFromLegacy()');
      const legacyStats = {
        streak_days: 15,
        last_study_date: '2026-01-24'
      };

      const migrated = StreakManager.migrateFromLegacy(legacyStats);
      assertEqual(migrated.current, 15, 'Migrated current streak');
      assertEqual(migrated.longest, 15, 'Migrated longest streak');
      assertEqual(migrated.last_study_date, '2026-01-24', 'Migrated last study date');
      assertEqual(migrated.freezes_available, 0, 'Fresh freezes count');

      // Final Summary
      summaryDiv.textContent = `Tests Complete: ${passCount} passed, ${failCount} failed`;
      summaryDiv.className = failCount === 0 ? 'summary all-pass' : 'summary has-fail';
    }

    // Run tests on load
    runTests();
  </script>
</body>
</html>
