name: PR Labeler

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Label by commit type
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];

            // Conventional commit type mapping
            const typeMap = {
              'feat': 'enhancement',
              'fix': 'bug',
              'docs': 'documentation',
              'refactor': 'refactor',
              'test': 'testing',
              'chore': 'chore',
              'perf': 'performance',
              'ci': 'ci/cd'
            };

            const match = title.match(/^(\w+)(\(.+\))?:/);
            if (match && typeMap[match[1]]) {
              labels.push(typeMap[match[1]]);
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
            }

      - name: Label by size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;

            let sizeLabel;
            if (total < 10) sizeLabel = 'size/XS';
            else if (total < 50) sizeLabel = 'size/S';
            else if (total < 200) sizeLabel = 'size/M';
            else if (total < 500) sizeLabel = 'size/L';
            else sizeLabel = 'size/XL';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel]
            });

      - name: Label by dbt layer
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const layerLabels = new Set();
            for (const file of files) {
              if (file.filename.includes('models/staging')) layerLabels.add('layer/staging');
              if (file.filename.includes('models/intermediate')) layerLabels.add('layer/intermediate');
              if (file.filename.includes('models/marts')) layerLabels.add('layer/marts');
              if (file.filename.includes('models/analytics')) layerLabels.add('layer/analytics');
            }

            if (layerLabels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [...layerLabels]
              });
            }
