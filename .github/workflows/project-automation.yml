name: Project Automation

on:
  issues:
    types: [opened, labeled]

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    # Only run for issues with 'workflow' or 'phase-3' labels
    if: |
      contains(github.event.issue.labels.*.name, 'workflow') ||
      contains(github.event.issue.labels.*.name, 'phase-3') ||
      contains(github.event.issue.labels.*.name, 'enhancement') ||
      contains(github.event.issue.labels.*.name, 'bug')
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v1.0.2
        with:
          # Project URL for v0.8 Roadmap
          # Note: Replace with actual project URL after creation
          project-url: https://github.com/users/cmbays/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}

      - name: Log addition
        run: |
          echo "Issue #${{ github.event.issue.number }} added to project"
          echo "Title: ${{ github.event.issue.title }}"
          echo "Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}"
