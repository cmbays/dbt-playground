<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Protocol Playground - dbt-playground</title>

  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ==================== Design System Tokens ====================
       Philosophy: "Linear calm + Raycast polish + Neobrutalist delight"
       ==================== */
    :root {
      /* === BASE LAYER (Monochrome) === */
      --color-bg-primary: #09090b;
      --color-bg-secondary: #0f0f11;
      --color-bg-elevated: #18181b;
      --color-bg-surface: #1c1c1f;

      /* Text - Opacity-based hierarchy */
      --color-text-primary: rgba(255, 255, 255, 0.87);
      --color-text-secondary: rgba(255, 255, 255, 0.60);
      --color-text-muted: rgba(255, 255, 255, 0.38);
      --color-text-disabled: rgba(255, 255, 255, 0.20);

      /* Borders */
      --color-border-subtle: rgba(255, 255, 255, 0.08);
      --color-border-default: rgba(255, 255, 255, 0.12);
      --color-border-strong: rgba(255, 255, 255, 0.20);

      /* === ATTENTION LAYER === */
      --color-action: #22d3ee;
      --color-action-hover: #06b6d4;
      --color-action-bold: #00e5ff;

      --color-success: #34d399;
      --color-success-hover: #10b981;
      --color-success-bold: #00ff88;

      --color-error: #f87171;
      --color-error-hover: #ef4444;
      --color-error-bold: #ff4444;

      --color-warning: #fbbf24;
      --color-warning-hover: #f59e0b;
      --color-warning-bold: #ffcc00;

      /* === EFFECTS === */
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-blur: blur(12px);
      --glass-border: rgba(255, 255, 255, 0.1);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.3);

      --border-bold: 2px solid;
      --shadow-brutal: 4px 4px 0px;

      --transition-fast: 150ms ease;
      --transition-normal: 200ms ease;
      --transition-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;

      /* === TYPOGRAPHY === */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;

      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;

      /* Step colors */
      --step-1: #3b82f6;
      --step-2: #8b5cf6;
      --step-3: #ec4899;
      --step-4: #f97316;
      --step-5: #22c55e;
      --step-6: #06b6d4;
      --step-7: #a855f7;
    }

    /* ==================== Base Styles ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==================== Header ==================== */
    .header {
      background: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border-default);
      padding: var(--space-4) var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .header h1 {
      font-size: var(--text-xl);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      letter-spacing: -0.02em;
    }

    .version-badge {
      background: var(--color-action);
      color: #000;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: var(--space-2);
      align-items: center;
    }

    /* ==================== Buttons ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text-primary);
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }

    .btn:hover {
      background: var(--color-bg-surface);
      border-color: var(--color-border-strong);
    }

    .btn:focus-visible {
      outline: 2px solid var(--color-action);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--color-action);
      color: #000;
      border: var(--border-bold) currentColor;
      font-weight: 600;
      box-shadow: var(--shadow-brutal) var(--color-action-bold);
      transition: all var(--transition-spring);
    }

    .btn-primary:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--color-action-bold);
    }

    .btn-primary:active {
      transform: translate(0, 0);
      box-shadow: 2px 2px 0px var(--color-action-bold);
    }

    /* ==================== Main Container ==================== */
    .container {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
      gap: 1px;
      background: var(--color-border-default);
    }

    /* ==================== Sidebar ==================== */
    .sidebar {
      width: 280px;
      background: var(--color-bg-secondary);
      border-right: 1px solid var(--color-border-default);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: var(--space-4);
      border-bottom: 1px solid var(--color-border-default);
      font-weight: 600;
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-3);
    }

    /* Step Navigation */
    .step-nav {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      border-left: 4px solid transparent;
    }

    .step-item:hover {
      background: var(--color-bg-surface);
    }

    .step-item.active {
      background: rgba(34, 211, 238, 0.1);
      border-left-color: var(--color-action);
    }

    .step-item.completed {
      opacity: 0.7;
    }

    .step-item.completed .step-number {
      background: var(--color-success);
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: var(--text-sm);
      color: #000;
      flex-shrink: 0;
    }

    .step-1 .step-number { background: var(--step-1); }
    .step-2 .step-number { background: var(--step-2); }
    .step-3 .step-number { background: var(--step-3); }
    .step-4 .step-number { background: var(--step-4); }
    .step-5 .step-number { background: var(--step-5); }
    .step-6 .step-number { background: var(--step-6); }
    .step-7 .step-number { background: var(--step-7); }

    .step-info {
      flex: 1;
      min-width: 0;
    }

    .step-title {
      font-weight: 500;
      font-size: var(--text-sm);
      color: var(--color-text-primary);
    }

    .step-duration {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* ==================== Main Content ==================== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--color-bg-primary);
      overflow: hidden;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: var(--space-6);
      overflow-y: auto;
    }

    /* Step Content Card */
    .step-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .step-header-number {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: var(--text-xl);
      color: #000;
    }

    .step-header-info h2 {
      font-size: var(--text-2xl);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .step-header-info p {
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
    }

    .step-content h3 {
      font-size: var(--text-lg);
      font-weight: 600;
      margin-top: var(--space-6);
      margin-bottom: var(--space-3);
      color: var(--color-text-primary);
    }

    .step-content p {
      color: var(--color-text-secondary);
      margin-bottom: var(--space-4);
      line-height: 1.7;
    }

    .step-content ul, .step-content ol {
      margin-left: var(--space-6);
      margin-bottom: var(--space-4);
      color: var(--color-text-secondary);
    }

    .step-content li {
      margin-bottom: var(--space-2);
    }

    .step-content code {
      background: var(--color-bg-elevated);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-action);
    }

    .step-content pre {
      background: var(--color-bg-elevated);
      padding: var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border-default);
      overflow-x: auto;
      margin-bottom: var(--space-4);
      font-size: var(--text-sm);
      font-family: var(--font-mono);
    }

    /* Checklist */
    .checklist {
      background: var(--color-bg-elevated);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin: var(--space-4) 0;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) 0;
      cursor: pointer;
      user-select: none;
    }

    .checklist-item:hover {
      color: var(--color-text-primary);
    }

    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--color-success);
      cursor: pointer;
    }

    .checklist-item label {
      cursor: pointer;
      color: var(--color-text-secondary);
    }

    .checklist-item input:checked + label {
      color: var(--color-success);
      text-decoration: line-through;
    }

    /* Observability Section */
    .observability-section {
      margin-top: var(--space-6);
      padding: var(--space-4);
      background: var(--color-bg-elevated);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border-default);
    }

    .observability-section h4 {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--color-action);
      margin-bottom: var(--space-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .signal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-3);
    }

    .signal-card {
      background: var(--color-bg-surface);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      text-align: center;
    }

    .signal-card .signal-icon {
      font-size: var(--text-2xl);
      margin-bottom: var(--space-1);
    }

    .signal-card .signal-name {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .signal-card .signal-value {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      margin-top: var(--space-1);
    }

    /* Pattern Detection */
    .pattern-detection {
      margin-top: var(--space-4);
      padding: var(--space-4);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(236, 72, 153, 0.1));
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: var(--radius-md);
    }

    .pattern-detection h4 {
      color: #a855f7;
      font-size: var(--text-sm);
      margin-bottom: var(--space-2);
    }

    .pattern-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-2) 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .pattern-item:last-child {
      border-bottom: none;
    }

    .pattern-name {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    .pattern-score {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
    }

    .pattern-score.high { background: var(--color-success); color: #000; }
    .pattern-score.medium { background: var(--color-warning); color: #000; }
    .pattern-score.low { background: var(--color-error); color: #000; }

    /* Navigation Controls */
    .nav-controls {
      border-top: 1px solid var(--color-border-default);
      padding: var(--space-4) var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-bg-secondary);
    }

    .progress-info {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .progress-text {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .progress-bar {
      height: 4px;
      width: 200px;
      background: var(--color-bg-surface);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--color-action), var(--color-action-bold));
      transition: width var(--transition-spring);
    }

    .nav-buttons {
      display: flex;
      gap: var(--space-2);
    }

    /* ==================== Demo Mode Panel ==================== */
    .demo-panel {
      background: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border-default);
      padding: var(--space-3) var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .demo-label {
      font-size: var(--text-xs);
      color: var(--color-warning);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .demo-controls {
      display: flex;
      gap: var(--space-2);
    }

    .demo-controls .btn {
      padding: var(--space-1) var(--space-3);
      font-size: var(--text-xs);
    }

    /* ==================== Footer ==================== */
    .footer {
      background: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border-default);
      padding: var(--space-3) var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .keyboard-hints {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
    }

    .keyboard-hints kbd {
      background: var(--color-bg-surface);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border-default);
      margin: 0 var(--space-1);
    }

    /* ==================== Responsive ==================== */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        max-height: 200px;
      }

      .signal-grid {
        grid-template-columns: 1fr;
      }

      .progress-bar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>
      Debug Protocol Playground
      <span class="version-badge">WAVE3</span>
    </h1>
    <div class="header-actions">
      <a href="workflow-hub.html" class="btn">Back to Hub</a>
      <button class="btn btn-primary" onclick="startDemo()">Start Demo</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Sidebar: Step Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">7-Step Protocol</div>
      <div class="sidebar-content">
        <nav class="step-nav" id="stepNav">
          <!-- Steps populated by JavaScript -->
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <div class="content-area">
        <div class="step-card" id="stepCard">
          <!-- Step content populated by JavaScript -->
        </div>
      </div>

      <!-- Navigation Controls -->
      <div class="nav-controls">
        <div class="progress-info">
          <span class="progress-text" id="progressText">Step 1 of 7</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 14.28%"></div>
          </div>
        </div>
        <div class="nav-buttons">
          <button class="btn" id="prevBtn" onclick="prevStep()" disabled>Previous</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextStep()">Next Step</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Demo Panel -->
  <div class="demo-panel">
    <span class="demo-label">Demo Mode</span>
    <div class="demo-controls">
      <button class="btn" onclick="simulateTrace()">Emit Trace</button>
      <button class="btn" onclick="simulateMetric()">Record Metric</button>
      <button class="btn" onclick="simulateLog()">Log Event</button>
      <button class="btn" onclick="detectPattern()">Detect Pattern</button>
    </div>
    <span id="demoStatus" style="font-size: var(--text-xs); color: var(--color-text-muted);"></span>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span>Debug Protocol v1.0 | Wave 3 WAVE3-028</span>
    <div class="keyboard-hints">
      <kbd>&#8592;</kbd> / <kbd>&#8594;</kbd> Navigate
      <kbd>1</kbd>-<kbd>7</kbd> Jump to step
      <kbd>D</kbd> Demo
    </div>
  </footer>

  <script>
    // ==================== Protocol Steps Data ====================
    const PROTOCOL_STEPS = [
      {
        number: 1,
        title: 'Reproduce',
        subtitle: 'Verify you can reliably trigger the bug',
        duration: '5-15 min',
        color: 'var(--step-1)',
        content: `
          <h3>Goal</h3>
          <p>Establish a reliable reproduction case before investigating. This ensures you're fixing the right problem.</p>

          <h3>Actions</h3>
          <ul>
            <li>Gather exact steps from the bug report</li>
            <li>Identify minimum reproduction case</li>
            <li>Document environment (versions, config, data state)</li>
            <li>Capture evidence (screenshots, logs, stack traces)</li>
          </ul>

          <h3>Checklist</h3>
          <div class="checklist" id="checklist1">
            <div class="checklist-item">
              <input type="checkbox" id="c1-1">
              <label for="c1-1">Bug reproduced locally</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c1-2">
              <label for="c1-2">Reproduction steps documented</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c1-3">
              <label for="c1-3">Evidence captured (logs, screenshots)</label>
            </div>
          </div>

          <h3>Expedited Path</h3>
          <p>If the bug is <strong>obvious and low-risk</strong> (e.g., typo, simple config error), you may skip directly to Step 5 (Fix).</p>
        `,
        signals: {
          trace: 'vibe-code-debug/debug_step_1_reproduce',
          metric: 'debug_step_duration_seconds{step_number="1"}',
          log: 'debug.step.1.started'
        }
      },
      {
        number: 2,
        title: 'Blast Radius',
        subtitle: 'Assess impact before diving deeper',
        duration: '5-10 min',
        color: 'var(--step-2)',
        content: `
          <h3>Goal</h3>
          <p>Understand how widespread the bug is before investing in root cause analysis. A production-wide outage needs different handling than a minor edge case.</p>

          <h3>Questions to Answer</h3>
          <ul>
            <li>How many users/systems affected?</li>
            <li>Is this a regression (worked before)?</li>
            <li>What data is at risk?</li>
            <li>Is there a workaround?</li>
          </ul>

          <h3>Severity Classification</h3>
          <pre>HIGH:   Production down, data loss risk
MEDIUM: Feature degraded, workaround exists
LOW:    Edge case, minimal impact</pre>

          <h3>Checklist</h3>
          <div class="checklist" id="checklist2">
            <div class="checklist-item">
              <input type="checkbox" id="c2-1">
              <label for="c2-1">Impact scope assessed</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c2-2">
              <label for="c2-2">Severity classified</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c2-3">
              <label for="c2-3">Stakeholders notified (if HIGH)</label>
            </div>
          </div>
        `,
        signals: {
          trace: 'vibe-code-debug/debug_step_2_blast_radius',
          metric: 'debug_step_duration_seconds{step_number="2"}',
          log: 'debug.symptom.detected'
        }
      },
      {
        number: 3,
        title: 'Hypothesis',
        subtitle: 'Form theories based on evidence',
        duration: '10-20 min',
        color: 'var(--step-3)',
        content: `
          <h3>Goal</h3>
          <p>Generate multiple plausible hypotheses before testing. Avoid tunnel vision by considering different categories.</p>

          <h3>Hypothesis Categories</h3>
          <ul>
            <li><strong>Code Error:</strong> Logic bug, edge case not handled</li>
            <li><strong>Data Issue:</strong> Corrupt/unexpected input data</li>
            <li><strong>Configuration:</strong> Environment, settings mismatch</li>
            <li><strong>Integration:</strong> External service, API contract break</li>
            <li><strong>Resource:</strong> Memory, disk, connection exhaustion</li>
          </ul>

          <h3>Evidence Gathering</h3>
          <pre>1. Review recent code changes (git log)
2. Check deployment history
3. Examine logs around failure time
4. Compare working vs broken environments</pre>

          <h3>Checklist</h3>
          <div class="checklist" id="checklist3">
            <div class="checklist-item">
              <input type="checkbox" id="c3-1">
              <label for="c3-1">3+ hypotheses generated</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c3-2">
              <label for="c3-2">Hypotheses ranked by likelihood</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c3-3">
              <label for="c3-3">Evidence gathered for top hypothesis</label>
            </div>
          </div>
        `,
        signals: {
          trace: 'vibe-code-debug/debug_step_3_hypothesis',
          metric: 'debug_step_duration_seconds{step_number="3"}',
          log: 'debug.hypothesis.formed'
        }
      },
      {
        number: 4,
        title: 'Root Cause',
        subtitle: 'Validate hypotheses and identify true cause',
        duration: '15-45 min',
        color: 'var(--step-4)',
        content: `
          <h3>Goal</h3>
          <p>Systematically test hypotheses until you find the root cause. Don't just treat symptoms.</p>

          <h3>Testing Process</h3>
          <ol>
            <li>Start with highest-probability hypothesis</li>
            <li>Design a test that would <strong>disprove</strong> it</li>
            <li>Execute test, record results</li>
            <li>If disproved, move to next hypothesis</li>
            <li>If confirmed, dig deeper for root cause</li>
          </ol>

          <h3>The "5 Whys" Technique</h3>
          <pre>Why did the API return 500?
  -> The database query timed out
Why did the query time out?
  -> Missing index on customer_id
Why was the index missing?
  -> Migration failed silently
Why did migration fail?
  -> Insufficient permissions
Why insufficient permissions?
  -> ROOT CAUSE: Service account not updated</pre>

          <h3>Checklist</h3>
          <div class="checklist" id="checklist4">
            <div class="checklist-item">
              <input type="checkbox" id="c4-1">
              <label for="c4-1">Hypothesis validated/invalidated</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c4-2">
              <label for="c4-2">Root cause identified (not symptom)</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c4-3">
              <label for="c4-3">Root cause documented with evidence</label>
            </div>
          </div>
        `,
        signals: {
          trace: 'vibe-code-debug/debug_step_4_root_cause',
          metric: 'debug_root_cause_total{root_cause_type="identified"}',
          log: 'debug.root_cause.identified'
        }
      },
      {
        number: 5,
        title: 'Fix',
        subtitle: 'Implement the solution',
        duration: '15-60 min',
        color: 'var(--step-5)',
        content: `
          <h3>Goal</h3>
          <p>Implement a fix that addresses the root cause, not just the symptoms. Consider both immediate fix and long-term prevention.</p>

          <h3>Fix Strategies</h3>
          <ul>
            <li><strong>Direct Fix:</strong> Address the root cause directly</li>
            <li><strong>Defensive Fix:</strong> Add validation to prevent recurrence</li>
            <li><strong>Architectural Fix:</strong> Refactor to eliminate class of bugs</li>
          </ul>

          <h3>Implementation Guidelines</h3>
          <pre>1. Keep fix minimal and focused
2. Add comments explaining why
3. Write regression test FIRST
4. Consider edge cases
5. Review for unintended side effects</pre>

          <h3>Checklist</h3>
          <div class="checklist" id="checklist5">
            <div class="checklist-item">
              <input type="checkbox" id="c5-1">
              <label for="c5-1">Fix implemented</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c5-2">
              <label for="c5-2">Regression test written</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c5-3">
              <label for="c5-3">Code reviewed</label>
            </div>
          </div>
        `,
        signals: {
          trace: 'vibe-code-debug/debug_step_5_fix',
          metric: 'debug_step_duration_seconds{step_number="5"}',
          log: 'debug.step.5.completed'
        }
      },
      {
        number: 6,
        title: 'Validate',
        subtitle: 'Verify the fix works completely',
        duration: '10-20 min',
        color: 'var(--step-6)',
        content: `
          <h3>Goal</h3>
          <p>Verify the fix resolves the original issue without introducing regressions.</p>

          <h3>Validation Checklist</h3>
          <ol>
            <li>Reproduce original bug -> should be FIXED</li>
            <li>Run regression test suite -> all pass</li>
            <li>Check related functionality -> no regressions</li>
            <li>Verify in staging environment</li>
            <li>Monitor after deployment</li>
          </ol>

          <h3>Edge Cases to Verify</h3>
          <pre>- Null/empty inputs
- Concurrent access
- Network failures
- Large data volumes
- Different user permissions</pre>

          <h3>Checklist</h3>
          <div class="checklist" id="checklist6">
            <div class="checklist-item">
              <input type="checkbox" id="c6-1">
              <label for="c6-1">Original bug no longer reproduces</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c6-2">
              <label for="c6-2">All tests passing</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c6-3">
              <label for="c6-3">Staging verification complete</label>
            </div>
          </div>
        `,
        signals: {
          trace: 'vibe-code-debug/debug_step_6_validate',
          metric: 'debug_step_duration_seconds{step_number="6"}',
          log: 'debug.hypothesis.validated'
        }
      },
      {
        number: 7,
        title: 'Document',
        subtitle: 'Capture learnings for the future',
        duration: '5-15 min',
        color: 'var(--step-7)',
        content: `
          <h3>Goal</h3>
          <p>Document the bug, root cause, and fix for future reference. Feed learnings back into LESSONS.md for pattern detection.</p>

          <h3>Documentation Template</h3>
          <pre>## Bug: [Brief Description]
**Date:** YYYY-MM-DD
**Severity:** HIGH/MEDIUM/LOW
**Time to Resolve:** X minutes

### Symptoms
- [Observable behavior]

### Root Cause
[The underlying issue]

### Fix
[What was done to resolve]

### Prevention
[How to prevent similar issues]

### Tags
#category #component</pre>

          <h3>Pattern Extraction</h3>
          <p>If this bug represents a pattern (2+ occurrences), consider adding to LESSONS.md with scoring:</p>
          <ul>
            <li><strong>Frequency (40%):</strong> How often does this occur?</li>
            <li><strong>Recency (30%):</strong> When was last occurrence?</li>
            <li><strong>Consistency (30%):</strong> Is pattern stable?</li>
          </ul>

          <h3>Checklist</h3>
          <div class="checklist" id="checklist7">
            <div class="checklist-item">
              <input type="checkbox" id="c7-1">
              <label for="c7-1">Bug documented in memory</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c7-2">
              <label for="c7-2">Pattern considered for LESSONS.md</label>
            </div>
            <div class="checklist-item">
              <input type="checkbox" id="c7-3">
              <label for="c7-3">Debug session logged</label>
            </div>
          </div>
        `,
        signals: {
          trace: 'vibe-code-debug/debug_step_7_document',
          metric: 'debug_lessons_extracted_total',
          log: 'debug.session.completed'
        }
      }
    ];

    // ==================== State ====================
    let currentStep = 0;
    let completedSteps = new Set();
    let sessionMetrics = {
      startTime: Date.now(),
      stepTimes: {},
      traces: [],
      logs: [],
      patterns: []
    };

    // ==================== Initialization ====================
    function init() {
      renderStepNav();
      renderStepContent();
      updateProgress();
      setupKeyboardNav();
    }

    function renderStepNav() {
      const nav = document.getElementById('stepNav');
      nav.innerHTML = PROTOCOL_STEPS.map((step, index) => `
        <div class="step-item step-${step.number} ${index === currentStep ? 'active' : ''} ${completedSteps.has(index) ? 'completed' : ''}"
             onclick="goToStep(${index})"
             data-step="${index}">
          <div class="step-number">${step.number}</div>
          <div class="step-info">
            <div class="step-title">${step.title}</div>
            <div class="step-duration">${step.duration}</div>
          </div>
        </div>
      `).join('');
    }

    function renderStepContent() {
      const step = PROTOCOL_STEPS[currentStep];
      const card = document.getElementById('stepCard');

      card.innerHTML = `
        <div class="step-header">
          <div class="step-header-number" style="background: ${step.color}">${step.number}</div>
          <div class="step-header-info">
            <h2>${step.title}</h2>
            <p>${step.subtitle}</p>
          </div>
        </div>
        <div class="step-content">
          ${step.content}
        </div>

        <div class="observability-section">
          <h4>Observability Signals</h4>
          <div class="signal-grid">
            <div class="signal-card">
              <div class="signal-icon">&#128269;</div>
              <div class="signal-name">Trace</div>
              <div class="signal-value">${step.signals.trace.split('/')[1]}</div>
            </div>
            <div class="signal-card">
              <div class="signal-icon">&#128200;</div>
              <div class="signal-name">Metric</div>
              <div class="signal-value">${step.signals.metric.split('{')[0]}</div>
            </div>
            <div class="signal-card">
              <div class="signal-icon">&#128221;</div>
              <div class="signal-name">Log Event</div>
              <div class="signal-value">${step.signals.log}</div>
            </div>
          </div>

          ${currentStep === 6 ? `
          <div class="pattern-detection">
            <h4>Pattern Detection (LESSONS Analyzer)</h4>
            <div id="patternList">
              <div class="pattern-item">
                <span class="pattern-name">Missing index on foreign key</span>
                <span class="pattern-score high">0.85</span>
              </div>
              <div class="pattern-item">
                <span class="pattern-name">Silent migration failure</span>
                <span class="pattern-score medium">0.72</span>
              </div>
              <div class="pattern-item">
                <span class="pattern-name">Permission escalation needed</span>
                <span class="pattern-score low">0.45</span>
              </div>
            </div>
          </div>
          ` : ''}
        </div>
      `;

      // Restore checkbox states
      restoreCheckboxStates();
    }

    function updateProgress() {
      const progress = ((currentStep + 1) / PROTOCOL_STEPS.length) * 100;
      document.getElementById('progressFill').style.width = `${progress}%`;
      document.getElementById('progressText').textContent = `Step ${currentStep + 1} of ${PROTOCOL_STEPS.length}`;

      document.getElementById('prevBtn').disabled = currentStep === 0;
      document.getElementById('nextBtn').textContent =
        currentStep === PROTOCOL_STEPS.length - 1 ? 'Complete Session' : 'Next Step';
    }

    // ==================== Navigation ====================
    function goToStep(index) {
      if (index < 0 || index >= PROTOCOL_STEPS.length) return;

      // Mark current step as completed
      saveCheckboxStates();
      completedSteps.add(currentStep);

      // Record step duration
      const now = Date.now();
      if (!sessionMetrics.stepTimes[currentStep]) {
        sessionMetrics.stepTimes[currentStep] = { start: now };
      }
      sessionMetrics.stepTimes[currentStep].end = now;

      // Go to new step
      currentStep = index;
      sessionMetrics.stepTimes[currentStep] = { start: now };

      renderStepNav();
      renderStepContent();
      updateProgress();
    }

    function nextStep() {
      if (currentStep === PROTOCOL_STEPS.length - 1) {
        completeSession();
      } else {
        goToStep(currentStep + 1);
      }
    }

    function prevStep() {
      goToStep(currentStep - 1);
    }

    function completeSession() {
      const duration = Math.round((Date.now() - sessionMetrics.startTime) / 1000 / 60);
      setDemoStatus(`Session complete! Duration: ${duration} min, Traces: ${sessionMetrics.traces.length}, Logs: ${sessionMetrics.logs.length}`);
      completedSteps.add(currentStep);
      renderStepNav();
    }

    // ==================== Checkbox State Management ====================
    function saveCheckboxStates() {
      const checkboxes = document.querySelectorAll('.checklist-item input[type="checkbox"]');
      checkboxes.forEach(cb => {
        localStorage.setItem(`debug_protocol_${cb.id}`, cb.checked);
      });
    }

    function restoreCheckboxStates() {
      const checkboxes = document.querySelectorAll('.checklist-item input[type="checkbox"]');
      checkboxes.forEach(cb => {
        const saved = localStorage.getItem(`debug_protocol_${cb.id}`);
        if (saved === 'true') {
          cb.checked = true;
        }
      });
    }

    // ==================== Demo Functions ====================
    function simulateTrace() {
      const step = PROTOCOL_STEPS[currentStep];
      const trace = {
        traceId: generateId(32),
        spanId: generateId(16),
        operation: step.signals.trace,
        timestamp: new Date().toISOString()
      };
      sessionMetrics.traces.push(trace);
      setDemoStatus(`Trace emitted: ${trace.traceId.substring(0, 8)}...`);
    }

    function simulateMetric() {
      const step = PROTOCOL_STEPS[currentStep];
      const duration = Math.round((Date.now() - (sessionMetrics.stepTimes[currentStep]?.start || Date.now())) / 1000);
      setDemoStatus(`Metric recorded: ${step.signals.metric} = ${duration}s`);
    }

    function simulateLog() {
      const step = PROTOCOL_STEPS[currentStep];
      const log = {
        timestamp: new Date().toISOString(),
        level: 'INFO',
        event: step.signals.log,
        step_number: step.number
      };
      sessionMetrics.logs.push(log);
      setDemoStatus(`Log event: ${step.signals.log}`);
    }

    function detectPattern() {
      const patterns = [
        { name: 'Missing null check', score: Math.random() * 0.3 + 0.7 },
        { name: 'Unhandled edge case', score: Math.random() * 0.3 + 0.5 },
        { name: 'Configuration drift', score: Math.random() * 0.3 + 0.3 }
      ];
      sessionMetrics.patterns.push(...patterns);

      const topPattern = patterns.sort((a, b) => b.score - a.score)[0];
      setDemoStatus(`Pattern detected: "${topPattern.name}" (score: ${topPattern.score.toFixed(2)})`);
    }

    function startDemo() {
      // Reset session
      sessionMetrics = {
        startTime: Date.now(),
        stepTimes: { 0: { start: Date.now() } },
        traces: [],
        logs: [],
        patterns: []
      };
      completedSteps.clear();
      currentStep = 0;

      // Clear localStorage
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('debug_protocol_')) {
          localStorage.removeItem(key);
        }
      }

      renderStepNav();
      renderStepContent();
      updateProgress();
      setDemoStatus('Demo session started');
    }

    function setDemoStatus(message) {
      document.getElementById('demoStatus').textContent = message;
    }

    // ==================== Utilities ====================
    function generateId(length) {
      const chars = '0123456789abcdef';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars[Math.floor(Math.random() * chars.length)];
      }
      return result;
    }

    // ==================== Keyboard Navigation ====================
    function setupKeyboardNav() {
      document.addEventListener('keydown', (e) => {
        // Ignore if in input/textarea
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        switch (e.key) {
          case 'ArrowLeft':
            prevStep();
            break;
          case 'ArrowRight':
            nextStep();
            break;
          case 'd':
          case 'D':
            startDemo();
            break;
          case '1':
          case '2':
          case '3':
          case '4':
          case '5':
          case '6':
          case '7':
            goToStep(parseInt(e.key) - 1);
            break;
        }
      });
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
