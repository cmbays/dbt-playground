<!DOCTYPE html>
<!-- Version: v0.4.0 - Updated: 2026-01-25 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Visualizations Tests - Sprint 2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #1e293b; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; }
        h2 { color: #475569; margin-top: 30px; }
        .test-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 6px;
        }
        .pass { background: #dcfce7; color: #166534; }
        .fail { background: #fee2e2; color: #991b1b; }
        .demo-container {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            background: #fafafa;
        }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
        code { font-family: 'Monaco', 'Consolas', monospace; }
    </style>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <h1>Dashboard Visualizations Tests - Sprint 2</h1>
    <p>Testing module: <code>dashboard-visualizations.js</code></p>

    <div id="test-results"></div>

    <h2>Visual Demos</h2>

    <div class="test-section">
        <h3>Heatmap Demo</h3>
        <div id="demo-heatmap" class="demo-container"></div>
    </div>

    <div class="test-section">
        <h3>Mastery Rings Demo</h3>
        <div id="demo-rings" class="demo-container mastery-rings-container"></div>
    </div>

    <div class="test-section">
        <h3>Trend Line Demo</h3>
        <div id="demo-trend" class="demo-container trend-container"></div>
    </div>

    <div class="test-section">
        <h3>At-Risk Panel Demo</h3>
        <div id="demo-at-risk" class="demo-container at-risk-container"></div>
    </div>

    <div class="test-section">
        <h3>Stats Summary Demo</h3>
        <div id="demo-stats" class="demo-container"></div>
    </div>

    <!-- Tooltips -->
    <div class="heatmap-tooltip" id="heatmap-tooltip"></div>
    <div class="trend-tooltip" id="trend-tooltip"></div>

    <script src="dashboard-visualizations.js"></script>
    <script>
        const results = [];

        function test(name, fn) {
            try {
                const result = fn();
                if (result === true || result === undefined) {
                    results.push({ name, passed: true });
                } else {
                    results.push({ name, passed: false, error: result || 'Test returned false' });
                }
            } catch (e) {
                results.push({ name, passed: false, error: e.message });
            }
        }

        function assertEqual(actual, expected, msg) {
            if (actual !== expected) {
                throw new Error(`${msg}: expected ${expected}, got ${actual}`);
            }
            return true;
        }

        function assertExists(obj, msg) {
            if (!obj) {
                throw new Error(`${msg}: object is null or undefined`);
            }
            return true;
        }

        // ============================================
        // UNIT TESTS
        // ============================================

        const DV = window.DashboardVisualizations;

        // Test module exists
        test('DashboardVisualizations module loads', () => {
            return assertExists(DV, 'Module should be defined');
        });

        // Test heatmap generation
        test('generateHeatmapData creates 365 cells', () => {
            assertExists(DV.generateHeatmapData, 'generateHeatmapData should exist');
            const data = DV.generateHeatmapData({});
            return assertEqual(data.length, 365, 'Should generate 365 cells');
        });

        // Test heatmap with actual data
        test('generateHeatmapData includes daily history', () => {
            const today = new Date().toLocaleDateString('en-CA');
            const history = {};
            history[today] = { reviews: 15 };

            const data = DV.generateHeatmapData(history);
            const todayCell = data.find(d => d.date === today);

            assertExists(todayCell, 'Today should be in heatmap');
            return assertEqual(todayCell.reviews, 15, 'Reviews should match');
        });

        // Test heatmap intensity levels
        test('generateHeatmapData calculates intensity levels', () => {
            const today = new Date().toLocaleDateString('en-CA');
            const history = {};
            history[today] = { reviews: 30 };

            const data = DV.generateHeatmapData(history);
            const todayCell = data.find(d => d.date === today);

            return assertEqual(todayCell.intensity, 3, 'Intensity for 30 reviews should be 3');
        });

        // Test daily history update
        test('updateDailyHistory creates history entry', () => {
            const schema = { stats: {} };
            DV.updateDailyHistory(schema, 10, 8, 100);

            assertExists(schema.stats.daily_history, 'daily_history should exist');
            const today = new Date().toLocaleDateString('en-CA');
            assertExists(schema.stats.daily_history[today], 'Today entry should exist');
            return assertEqual(schema.stats.daily_history[today].reviews, 10, 'Reviews should match');
        });

        // Test daily history accumulation
        test('updateDailyHistory accumulates data', () => {
            const today = new Date().toLocaleDateString('en-CA');
            const schema = {
                stats: {
                    daily_history: {}
                }
            };
            schema.stats.daily_history[today] = { reviews: 5, correct: 4, xp_earned: 50 };
            DV.updateDailyHistory(schema, 10, 8, 100);
            return assertEqual(schema.stats.daily_history[today].reviews, 15, 'Reviews should accumulate');
        });

        // Test at-risk tracking
        test('trackAtRiskKanji adds character when regressing', () => {
            const schema = { stats: {} };
            DV.trackAtRiskKanji(schema, '日', 'guru_1', 'apprentice_4');

            assertExists(schema.stats.at_risk_kanji, 'at_risk_kanji should exist');
            assertEqual(schema.stats.at_risk_kanji.length, 1, 'Should have 1 at-risk kanji');
            return assertEqual(schema.stats.at_risk_kanji[0].character, '日', 'Character should match');
        });

        // Test at-risk removal on recovery
        test('trackAtRiskKanji removes character when recovering', () => {
            const schema = {
                stats: {
                    at_risk_kanji: [{ character: '日', date: new Date().toLocaleDateString('en-CA') }]
                }
            };
            DV.trackAtRiskKanji(schema, '日', 'apprentice_4', 'guru_1');
            return assertEqual(schema.stats.at_risk_kanji.length, 0, 'Should remove recovered kanji');
        });

        // Test weekly snapshot check
        test('shouldTakeWeeklySnapshot returns true for empty', () => {
            const result = DV.shouldTakeWeeklySnapshot([]);
            return assertEqual(result, true, 'Should return true for empty snapshots');
        });

        test('shouldTakeWeeklySnapshot returns false for recent snapshot', () => {
            const today = new Date().toLocaleDateString('en-CA');
            const result = DV.shouldTakeWeeklySnapshot([{ date: today }]);
            return assertEqual(result, false, 'Should return false for recent snapshot');
        });

        // Test getLocalDateString
        test('getLocalDateString returns YYYY-MM-DD format', () => {
            const result = DV.getLocalDateString();
            const pattern = /^\d{4}-\d{2}-\d{2}$/;
            if (!pattern.test(result)) {
                throw new Error('Date format should be YYYY-MM-DD, got: ' + result);
            }
            return true;
        });

        // ============================================
        // RENDER TESTS
        // ============================================

        console.log('Running tests...');

        // Display results
        const resultsDiv = document.getElementById('test-results');
        let html = '<div class="test-section"><h2>Test Results</h2>';
        let passed = 0;
        let failed = 0;

        results.forEach(r => {
            if (r.passed) {
                passed++;
                html += `<div class="test-result pass">✓ ${r.name}</div>`;
            } else {
                failed++;
                html += `<div class="test-result fail">✗ ${r.name}: ${r.error}</div>`;
            }
        });

        html += `<p><strong>Results: ${passed}/${results.length} passed</strong></p>`;
        html += '</div>';
        resultsDiv.innerHTML = html;

        // ============================================
        // VISUAL DEMOS
        // ============================================

        // Demo: Heatmap
        const demoHistory = {};
        const now = new Date();
        for (let i = 0; i < 100; i++) {
            const date = new Date(now);
            date.setDate(date.getDate() - i);
            const dateStr = date.toLocaleDateString('en-CA');
            if (Math.random() > 0.3) {
                demoHistory[dateStr] = {
                    reviews: Math.floor(Math.random() * 60),
                    xp: Math.floor(Math.random() * 300)
                };
            }
        }
        DV.renderHeatmap(document.getElementById('demo-heatmap'), demoHistory);

        // Demo: Mastery Rings
        const demoKanji = {
            '日': { topic: 'home-life', srs: { stage: 'burned' } },
            '月': { topic: 'home-life', srs: { stage: 'master' } },
            '火': { topic: 'home-life', srs: { stage: 'guru_1' } },
            '水': { topic: 'shopping', srs: { stage: 'master' } },
            '木': { topic: 'shopping', srs: { stage: 'enlightened' } },
            '金': { topic: 'restaurant', srs: { stage: 'apprentice_1' } },
            '土': { topic: 'travel', srs: { stage: 'burned' } }
        };
        DV.renderTopicMasteryRings(document.getElementById('demo-rings'), demoKanji);

        // Demo: Trend Line
        const demoSnapshots = [];
        for (let i = 7; i >= 0; i--) {
            const date = new Date();
            date.setDate(date.getDate() - (i * 7));
            demoSnapshots.push({
                date: date.toLocaleDateString('en-CA'),
                overall_mastery: 10 + (7 - i) * 8 + Math.floor(Math.random() * 10)
            });
        }
        const trendSvg = DV.createTrendLine(demoSnapshots);
        if (trendSvg) {
            document.getElementById('demo-trend').appendChild(trendSvg);
        }

        // Demo: At-Risk Panel
        const demoAtRisk = [
            { character: '食', dropped_from: 'guru_1', dropped_to: 'apprentice_4', date: '2026-01-20' },
            { character: '読', dropped_from: 'master', dropped_to: 'guru_1', date: '2026-01-22' }
        ];
        const demoMetadata = [
            { character: '食', meanings: ['eat', 'food'], onyomi: ['ショク'], kunyomi: ['た.べる'] },
            { character: '読', meanings: ['read'], onyomi: ['ドク'], kunyomi: ['よ.む'] }
        ];
        DV.renderAtRiskPanel(document.getElementById('demo-at-risk'), demoAtRisk, demoMetadata);

        // Demo: Stats Summary
        const demoSchema = {
            stats: {
                xp: { total: 2450 },
                streak: { current: 14 },
                daily_history: demoHistory,
                today: { reviews_completed: 25, correct_count: 22 },
                total_reviews: 450,
                total_kanji_seen: 85
            },
            kanji: demoKanji
        };
        DV.renderStatsSummary(document.getElementById('demo-stats'), demoSchema);

        console.log(`Tests complete: ${passed}/${results.length} passed`);
    </script>
</body>
</html>
