name: Question
description: Ask about the codebase, features, or implementation
title: "[Question] "
labels: ["type:question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      options:
        - "Architecture / Technical Design"
        - "Feature Clarification"
        - "Implementation Guidance"
        - "Testing / Verification"
        - "Japanese Content"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you working on? Why are you asking?
      placeholder: I'm implementing T1.2 (SM-2 algorithm) and wondering about...
