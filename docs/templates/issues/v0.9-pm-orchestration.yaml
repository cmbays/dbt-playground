  - title: "feat(pm-state): implement atomic task claiming"
    description: |
      ## Summary
      Ensure only one session can claim a task at a time.

      ## Implementation
      ```sql
      BEGIN IMMEDIATE;
      UPDATE tasks SET assigned_session = :session_id
      WHERE task_id = :task_id
        AND (assigned_session IS NULL OR assigned_session = :session_id);
      COMMIT;
      ```

      ## Tasks
      - [ ] Implement claim logic in MCP tool
      - [ ] Handle race conditions gracefully
      - [ ] Return claim success/failure
      - [ ] Generate alert on conflict

      ## Acceptance Criteria
      - [ ] Concurrent claim attempts resolve correctly
      - [ ] Losing session receives notification
    labels:
      - "epic:pm-orchestration"
      - "type:feature"

  - title: "feat(pm-state): implement conflict detection and alerts"
    description: |
      ## Summary
      Detect and alert on various conflict conditions.

      ## Alert Types
      - Stale Session (no heartbeat > 5 min)
      - Task Conflict (two sessions claim same task)
      - Blocked Work (task status = BLOCKED)
      - Long-Running (task in progress > 4 hrs)
      - Orphaned Task (in progress but no active session)

      ## Tasks
      - [ ] Implement detection queries
      - [ ] Create alert generation logic
      - [ ] Add alert acknowledgment
      - [ ] Test alert conditions

      ## Acceptance Criteria
      - [ ] Alerts fire on trigger conditions
      - [ ] Alerts can be acknowledged
    labels:
      - "epic:pm-orchestration"
      - "type:feature"

