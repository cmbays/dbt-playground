name: Epic (Feature PRD)
description: High-level feature specification linking to PRD document
title: "[Epic] "
labels: ["type:epic", "status:draft"]
assignees:
  - cmbays
body:
  - type: markdown
    attributes:
      value: |
        ## Epic Issue Template
        Use this for high-level features that will be broken down into multiple implementation tasks.

  - type: input
    id: prd-link
    attributes:
      label: PRD Document
      description: Link to the PRD document in docs/specs/
      placeholder: docs/specs/PRD-029-GITHUB-INTEGRATION.md
    validations:
      required: true

  - type: input
    id: tdd-link
    attributes:
      label: TDD Document
      description: Link to the Technical Design Document (if exists)
      placeholder: docs/specs/TDD-029-GITHUB-INTEGRATION.md
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Which roadmap phase does this belong to?
      options:
        - "v0.8 (Data Quality)"
        - "v0.9 (TBD)"
        - "v0.10 (Agent Orchestration)"
        - "v1.0 (Production Ready)"
        - "Future (v1.1+)"
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Target milestone for this epic
      placeholder: v0.10
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief description of what this epic accomplishes (1-3 sentences)
      placeholder: Implement GitHub integration enhancements with CODEOWNERS, task file sync, and PRD traceability.
    validations:
      required: true

  - type: textarea
    id: user-benefit
    attributes:
      label: User Benefit
      description: How does this help developers/agents?
      placeholder: |
        - Automatic reviewer assignment via CODEOWNERS
        - Full traceability from PRD to implementation
        - Reduced manual task file management
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria (High-Level)
      description: Summary of key acceptance criteria from PRD
      placeholder: |
        - [ ] CODEOWNERS file created
        - [ ] Task files auto-created on issue open
        - [ ] PRD links present in all implementation issues
      render: markdown
    validations:
      required: true

  - type: textarea
    id: task-breakdown
    attributes:
      label: Task Breakdown
      description: List of implementation tasks (will be created as separate issues)
      placeholder: |
        - [ ] #XX T1.1 - Create CODEOWNERS file
        - [ ] #XX T1.2 - Implement task file sync workflow
        - [ ] #XX T1.3 - Add PRD traceability metadata
      render: markdown

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other epics or systems this depends on
      placeholder: "Depends on: #X (Epic Name)"

  - type: dropdown
    id: personas
    attributes:
      label: Primary Personas
      description: Which personas will work on this? (Select one, add others via labels)
      options:
        - "Product Manager"
        - "Technical Architect"
        - "Developer"
        - "Tester"
        - "Code Reviewer"
        - "Git-Master"
    validations:
      required: true
