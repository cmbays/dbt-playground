[project]
name = "dbt-playground"
version = "0.7.0"
description = "Synthetic Synthea healthcare dbt project (DuckDB) — public fixture source and dogfood target for the cute-dbt tool"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.10.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "pre-commit>=3.7.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", ".git"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function call in default argument
]

[tool.ruff.format]
quote-style = "single"
