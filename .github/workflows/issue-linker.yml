name: Issue Linker

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check for linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Match: Closes #N, Fixes #N, Resolves #N, Related to #N
            const issuePattern = /(closes?|fixes?|resolves?|related to)\s+#(\d+)/gi;
            const matches = [...body.matchAll(issuePattern)];

            if (matches.length === 0) {
              core.setFailed('PR must reference at least one issue. Add "Closes #N" or "Related to #N" in the description.');
              return;
            }

            // Log linked issues
            const issueNumbers = matches.map(m => m[2]);
            console.log(`Linked issues: ${issueNumbers.join(', ')}`);

            // Verify issues exist
            for (const num of issueNumbers) {
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(num)
                });
              } catch (e) {
                core.setFailed(`Issue #${num} not found`);
                return;
              }
            }

            console.log('All linked issues verified');
