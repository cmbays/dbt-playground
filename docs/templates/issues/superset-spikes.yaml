issues:
  - title: "spike: Event-Driven Monitoring - Implementation Research & Gap Analysis"
    description: |
      ## Objective

      Understand how Superset implements real-time event-driven monitoring, compare to our current polling approach, and assess refactoring vs rebuild effort.

      ## Background

      From Superset research (RESEARCH_REPORT.md), their DaemonTerminalManager uses event emitters for real-time updates:
      - Push-based events via Electron IPC (no polling)
      - Event types: `data:{paneId}`, `exit:{paneId}`, `workspace:changed`
      - Instant UI updates without manual refresh

      Our current approach in Workflow Hub uses `setInterval` polling (every 5-10 seconds).

      ## Research Questions

      1. How does Superset implement this? (code references, architecture)
         - `daemon-manager.ts` (646 lines) - main orchestration
         - `terminal-host/client.ts` - IPC wrapper
      2. What tech stack do they use? Why those choices?
         - node-pty, EventEmitter, Electron IPC
      3. What have we tried implementing? (search our codebase)
         - `playgrounds/workflow-hub.html` lines 3377-3410 (polling)
         - `scripts/worktree_monitor/monitor.py` (polling logic)
         - `memory/events.jsonl` (event stream already exists!)
      4. What's the gap between their approach and ours?
      5. Is this a refactoring opportunity or brand new work?
      6. How does this improve user experience?
         - Quantify: 100ms poll interval -> instant notification
      7. What's the minimal vertical slice to demonstrate value?
         - One event type: `task:completed`

      ## Deliverables

      - [ ] `EVENT_DRIVEN_DEEP_DIVE.md` in `temp/AGENT_REPORTS/superset-research/`
      - [ ] `GAP_ANALYSIS_EVENT_DRIVEN.md` (comparison + refactoring assessment)
      - [ ] User stories for feature planning

      ## Timeline

      1 week research + 1 day team synthesis

      ## Success Criteria

      - [ ] Clear understanding of Superset's approach
      - [ ] Clear understanding of our current patterns (document existing code)
      - [ ] Refactoring vs rebuild decision documented
      - [ ] Minimal viable user story written

      ## Related

      - Research: `temp/AGENT_REPORTS/superset-research/RESEARCH_REPORT.md`
      - Gap Analysis: `temp/AGENT_REPORTS/superset-research/GAP_ANALYSIS.md`
      - Integration Pathway: `temp/AGENT_REPORTS/superset-research/INTEGRATION_PATHWAY.md`
    labels: [spike, architecture, research, enhancement]
    priority: high

  - title: "spike: Cold State Recovery - Implementation Research & Gap Analysis"
    description: |
      ## Objective

      Understand how Superset persists terminal history for crash recovery, compare to our restart-from-scratch approach, and assess refactoring vs rebuild effort.

      ## Background

      From Superset research (RESEARCH_REPORT.md), their HistoryManager persists scrollback:
      - 100KB max scrollback per session stored to disk
      - Session metadata (exitCode, lastActive, restored flag)
      - Recovery flow: list sessions -> user clicks restore -> load from disk

      Our current approach requires re-running dbt builds on session restart.

      ## Research Questions

      1. How does Superset implement this? (code references, architecture)
         - `history-manager.ts` (200+ lines)
         - Session metadata storage pattern
      2. What tech stack do they use? Why those choices?
         - Filesystem-based, append-only scrollback files
      3. What have we tried implementing? (search our codebase)
         - `dbt_project/target/` - dbt build artifacts already exist
         - `temp/WORKFLOW_STATE.md` - current session state
         - ADR-019: Debug Session Persistence patterns
      4. What's the gap between their recovery and our restart-from-scratch?
      5. Is this a refactoring opportunity (persist existing dbt artifacts) or new work?
      6. How does this improve user experience?
         - Quantify: 5 min cold start -> 30 sec warm start
      7. What's the minimal vertical slice to demonstrate value?
         - Persist manifest.json only

      ## Deliverables

      - [ ] `COLD_RECOVERY_DEEP_DIVE.md` in `temp/AGENT_REPORTS/superset-research/`
      - [ ] `GAP_ANALYSIS_COLD_RECOVERY.md` (comparison + refactoring assessment)
      - [ ] User stories for feature planning

      ## Timeline

      1 week research + 1 day team synthesis

      ## Success Criteria

      - [ ] Clear understanding of Superset's approach
      - [ ] Clear understanding of our current patterns
