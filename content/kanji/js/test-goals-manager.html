<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals Manager Tests (T2.9)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { color: #333; border-bottom: 2px solid #22c55e; padding-bottom: 10px; }
    h2 { color: #555; margin-top: 30px; }
    .test-section {
      background: #f5f5f5;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
    }
    .test-result {
      padding: 8px 12px;
      margin: 5px 0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
    .pass {
      background: #d4edda;
      color: #155724;
      border-left: 4px solid #28a745;
    }
    .fail {
      background: #f8d7da;
      color: #721c24;
      border-left: 4px solid #dc3545;
    }
    .info {
      background: #e7f3ff;
      color: #004085;
      border-left: 4px solid #0066cc;
    }
    .warning {
      background: #fff3cd;
      color: #856404;
      border-left: 4px solid #ffc107;
    }
    pre {
      background: #282c34;
      color: #abb2bf;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
    .summary {
      background: #333;
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-top: 30px;
      text-align: center;
      font-size: 18px;
    }
    .summary.all-pass { background: #28a745; }
    .summary.has-fail { background: #dc3545; }
    .progress-demo {
      background: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      height: 20px;
      margin: 10px 0;
    }
    .progress-fill {
      height: 100%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <h1>Goals Manager Tests (T2.9)</h1>
  <p>Testing <code>goals-manager.js</code> per TDD-003 §5 specifications.</p>

  <div id="results"></div>
  <div id="summary" class="summary"></div>

  <script src="goals-manager.js"></script>
  <script>
    const resultsDiv = document.getElementById('results');
    const summaryDiv = document.getElementById('summary');
    let passCount = 0;
    let failCount = 0;

    function log(message, status = 'info') {
      const div = document.createElement('div');
      div.className = 'test-result ' + status;

      if (status === 'pass') {
        div.textContent = '✓ ' + message;
        passCount++;
      } else if (status === 'fail') {
        div.textContent = '✗ ' + message;
        failCount++;
      } else if (status === 'warning') {
        div.textContent = '⚠ ' + message;
      } else {
        div.textContent = message;
      }

      resultsDiv.appendChild(div);
    }

    function section(title) {
      const h2 = document.createElement('h2');
      h2.textContent = title;
      resultsDiv.appendChild(h2);
    }

    function assertEqual(actual, expected, description) {
      if (actual === expected) {
        log(`${description}: ${actual} === ${expected}`, 'pass');
      } else {
        log(`${description}: got ${actual}, expected ${expected}`, 'fail');
      }
    }

    function assertTrue(value, description) {
      if (value) {
        log(`${description}: true`, 'pass');
      } else {
        log(`${description}: got false, expected true`, 'fail');
      }
    }

    function assertFalse(value, description) {
      if (!value) {
        log(`${description}: false`, 'pass');
      } else {
        log(`${description}: got true, expected false`, 'fail');
      }
    }

    // Helper to create mock schema
    function createMockSchema(overrides = {}) {
      const today = new Date().toLocaleDateString('en-CA');
      return {
        settings: {
          daily_goal: {
            enabled: true,
            target_cards: 10,
            notify_enabled: false,
            notify_time: '19:00',
            ...(overrides.daily_goal || {})
          }
        },
        stats: {
          today: {
            date: today,
            reviews_completed: 0,
            new_cards_introduced: 0,
            goal_completed: false,
            ...(overrides.today || {})
          },
          daily_history: overrides.daily_history || {}
        }
      };
    }

    function showProgressBar(percentage) {
      const container = document.createElement('div');
      container.className = 'progress-demo';

      const fill = document.createElement('div');
      fill.className = 'progress-fill';
      fill.style.width = `${percentage}%`;
      fill.style.backgroundColor = GoalsManager.getProgressColor(percentage);

      container.appendChild(fill);
      resultsDiv.appendChild(container);
    }

    // ============================================
    // Test Suite
    // ============================================

    function runTests() {
      // Test 1: Constants
      section('1. Constants Verification');
      assertEqual(GoalsManager.GOAL_MIN, 1, 'GOAL_MIN');
      assertEqual(GoalsManager.GOAL_MAX, 100, 'GOAL_MAX');
      assertEqual(GoalsManager.GOAL_DEFAULT, 10, 'GOAL_DEFAULT');
      assertEqual(GoalsManager.GOAL_COMPLETION_BONUS, 50, 'GOAL_COMPLETION_BONUS');
      assertTrue(GoalsManager.GOAL_PRESETS.includes(5), 'Presets include 5');
      assertTrue(GoalsManager.GOAL_PRESETS.includes(20), 'Presets include 20');

      // Test 2: setDailyGoal (TDD-003 §5.2)
      section('2. setDailyGoal()');
      let schema = createMockSchema();

      let result = GoalsManager.setDailyGoal(schema, 15);
      assertTrue(result.success, 'Set goal to 15: success');
      assertEqual(schema.settings.daily_goal.target_cards, 15, 'Target cards = 15');

      result = GoalsManager.setDailyGoal(schema, 0);
      assertFalse(result.success, 'Reject goal of 0');
      assertEqual(schema.settings.daily_goal.target_cards, 15, 'Target unchanged');

      result = GoalsManager.setDailyGoal(schema, 101);
      assertFalse(result.success, 'Reject goal > 100');

      result = GoalsManager.setDailyGoal(schema, 1);
      assertTrue(result.success, 'Accept goal of 1');

      result = GoalsManager.setDailyGoal(schema, 100);
      assertTrue(result.success, 'Accept goal of 100');

      // Test 3: getGoalProgress (TDD-003 §5.2)
      section('3. getGoalProgress()');

      schema = createMockSchema({
        daily_goal: { target_cards: 10 },
        today: { reviews_completed: 5, new_cards_introduced: 0 }
      });

      let progress = GoalsManager.getGoalProgress(schema);
      assertEqual(progress.target, 10, 'Target = 10');
      assertEqual(progress.completed, 5, 'Completed = 5');
      assertEqual(progress.percentage, 50, 'Percentage = 50%');
      assertFalse(progress.isComplete, 'Not complete at 50%');
      assertEqual(progress.remaining, 5, 'Remaining = 5');
      assertTrue(progress.enabled, 'Goals enabled');

      // Test at 100%
      schema = createMockSchema({
        daily_goal: { target_cards: 10 },
        today: { reviews_completed: 8, new_cards_introduced: 2 }
      });
      progress = GoalsManager.getGoalProgress(schema);
      assertEqual(progress.percentage, 100, 'Percentage = 100% at exact target');
      assertTrue(progress.isComplete, 'Complete at 100%');

      // Test overachievement
      schema = createMockSchema({
        daily_goal: { target_cards: 10 },
        today: { reviews_completed: 15, new_cards_introduced: 0 }
      });
      progress = GoalsManager.getGoalProgress(schema);
      assertEqual(progress.percentage, 100, 'Percentage capped at 100%');
      assertEqual(progress.completed, 15, 'Completed shows actual 15');
      assertTrue(progress.isComplete, 'Complete when over target');
      assertEqual(progress.remaining, 0, 'Remaining = 0 when over');

      // Test 4: checkGoalCompletion (TDD-003 §5.2)
      section('4. checkGoalCompletion()');

      // First completion
      schema = createMockSchema({
        daily_goal: { target_cards: 10 },
        today: { reviews_completed: 10, new_cards_introduced: 0, goal_completed: false }
      });

      result = GoalsManager.checkGoalCompletion(schema);
      assertTrue(result.justCompleted, 'First completion detected');
      assertEqual(result.bonusXP, 50, 'Bonus XP = 50');
      assertTrue(schema.stats.today.goal_completed, 'goal_completed flag set');

      // Already completed - no bonus again
      result = GoalsManager.checkGoalCompletion(schema);
      assertFalse(result.justCompleted, 'Second check: not newly completed');
      assertEqual(result.bonusXP, 0, 'No bonus on second check');
      assertTrue(result.previouslyCompleted, 'previouslyCompleted = true');

      // Not yet complete
      schema = createMockSchema({
        daily_goal: { target_cards: 10 },
        today: { reviews_completed: 5, new_cards_introduced: 0, goal_completed: false }
      });
      result = GoalsManager.checkGoalCompletion(schema);
      assertFalse(result.justCompleted, 'Not complete at 50%');
      assertEqual(result.bonusXP, 0, 'No bonus when incomplete');

      // Test 5: Goal Enabled/Disabled
      section('5. Goal Enable/Disable');

      schema = createMockSchema({ daily_goal: { enabled: true } });
      GoalsManager.setGoalEnabled(schema, false);
      assertFalse(schema.settings.daily_goal.enabled, 'Goal disabled');

      progress = GoalsManager.getGoalProgress(schema);
      assertFalse(progress.enabled, 'Progress shows disabled');

      // Disabled goals don't give completion bonus
      schema = createMockSchema({
        daily_goal: { enabled: false, target_cards: 10 },
        today: { reviews_completed: 15, goal_completed: false }
      });
      result = GoalsManager.checkGoalCompletion(schema);
      assertFalse(result.justCompleted, 'No completion when disabled');
      assertEqual(result.bonusXP, 0, 'No bonus when disabled');

      // Test 6: Notification Support
      section('6. Notification Support');
      const notificationSupported = GoalsManager.isNotificationSupported();
      log(`Notifications supported: ${notificationSupported}`, 'info');

      if (notificationSupported) {
        const permission = GoalsManager.getNotificationPermission();
        log(`Current permission: ${permission}`, 'info');
      }

      // Test notification settings
      schema = createMockSchema();
      result = GoalsManager.setNotificationSettings(schema, true, '18:30');
      assertTrue(result.success, 'Set notification time to 18:30');
      assertEqual(schema.settings.daily_goal.notify_time, '18:30', 'Notify time updated');
      assertTrue(schema.settings.daily_goal.notify_enabled, 'Notifications enabled');

      // Invalid time format
      result = GoalsManager.setNotificationSettings(schema, true, '25:00');
      assertFalse(result.success, 'Reject invalid time 25:00');

      result = GoalsManager.setNotificationSettings(schema, true, '12:60');
      assertFalse(result.success, 'Reject invalid time 12:60');

      result = GoalsManager.setNotificationSettings(schema, true, '09:05');
      assertTrue(result.success, 'Accept valid time 09:05');

      // Test 7: Progress Colors
      section('7. getProgressColor()');
      log('Progress bar color demos:', 'info');

      assertEqual(GoalsManager.getProgressColor(0), '#ef4444', '0% = red');
      showProgressBar(0);

      assertEqual(GoalsManager.getProgressColor(25), '#f97316', '25% = orange');
      showProgressBar(25);

      assertEqual(GoalsManager.getProgressColor(50), '#eab308', '50% = yellow');
      showProgressBar(50);

      assertEqual(GoalsManager.getProgressColor(75), '#84cc16', '75% = lime');
      showProgressBar(75);

      assertEqual(GoalsManager.getProgressColor(100), '#22c55e', '100% = green');
      showProgressBar(100);

      // Test 8: Progress Messages
      section('8. getProgressMessage()');

      progress = { enabled: true, isComplete: true, percentage: 100, remaining: 0, target: 10 };
      let message = GoalsManager.getProgressMessage(progress);
      assertTrue(message.includes('🎉'), 'Complete message has celebration');

      progress = { enabled: true, isComplete: false, percentage: 0, remaining: 10, target: 10 };
      message = GoalsManager.getProgressMessage(progress);
      assertTrue(message.includes('Start'), '0% message says Start');

      progress = { enabled: true, isComplete: false, percentage: 50, remaining: 5, target: 10 };
      message = GoalsManager.getProgressMessage(progress);
      assertTrue(message.includes('5'), '50% message shows remaining');

      progress = { enabled: false, isComplete: false, percentage: 0, remaining: 10, target: 10 };
      message = GoalsManager.getProgressMessage(progress);
      assertTrue(message.includes('disabled'), 'Disabled message');

      // Test 9: Format Goal Progress
      section('9. formatGoalProgress()');
      progress = { completed: 5, target: 10 };
      assertEqual(GoalsManager.formatGoalProgress(progress), '5/10', 'Format 5/10');

      progress = { completed: 15, target: 20 };
      assertEqual(GoalsManager.formatGoalProgress(progress), '15/20', 'Format 15/20');

      // Test 10: Goal Presets
      section('10. getGoalPresets()');
      const presets = GoalsManager.getGoalPresets(10);
      assertEqual(presets.length, 5, '5 preset options');
      assertTrue(presets.some(p => p.value === 10 && p.selected), 'Current value selected');
      assertTrue(presets.every(p => p.label.includes('cards')), 'All labels include "cards"');

      // Test 11: Goal Settings
      section('11. getGoalSettings()');
      schema = createMockSchema({
        daily_goal: { enabled: true, target_cards: 25, notify_enabled: true, notify_time: '20:00' }
      });

      const settings = GoalsManager.getGoalSettings(schema);
      assertEqual(settings.target_cards, 25, 'Settings target = 25');
      assertTrue(settings.enabled, 'Settings enabled');
      assertTrue(settings.notify_enabled, 'Settings notify enabled');
      assertEqual(settings.notify_time, '20:00', 'Settings notify time');

      // Test 12: Goal Completion Stats
      section('12. getGoalCompletionStats()');

      // Create schema with some history
      const historySchema = createMockSchema();
      const today = new Date();

      // Add some history (last 5 days, alternating completion)
      for (let i = 0; i < 5; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateStr = date.toLocaleDateString('en-CA');
        historySchema.stats.daily_history[dateStr] = {
          reviews: i % 2 === 0 ? 15 : 5, // Alternate: complete, incomplete
          new_cards: 0
        };
      }

      const stats = GoalsManager.getGoalCompletionStats(historySchema, 5);
      assertTrue(stats.totalDays === 5, 'Analyzed 5 days');
      assertTrue(stats.daysCompleted >= 0, 'Has completion count');
      assertTrue(stats.completionRate >= 0 && stats.completionRate <= 100, 'Valid completion rate');
      log(`Stats: ${stats.daysCompleted}/5 days, ${stats.completionRate}% rate, ${stats.currentStreak} streak`, 'info');

      // Test 13: Edge Cases
      section('13. Edge Cases');

      // Null schema
      progress = GoalsManager.getGoalProgress(null);
      assertEqual(progress.completed, 0, 'Null schema: completed = 0');
      assertFalse(progress.enabled, 'Null schema: disabled');

      // Missing today object
      schema = { settings: { daily_goal: { target_cards: 10 } }, stats: {} };
      progress = GoalsManager.getGoalProgress(schema);
      assertEqual(progress.completed, 0, 'Missing today: completed = 0');

      // Goal of 1 card
      schema = createMockSchema({
        daily_goal: { target_cards: 1 },
        today: { reviews_completed: 1 }
      });
      progress = GoalsManager.getGoalProgress(schema);
      assertTrue(progress.isComplete, 'Goal of 1: complete with 1 review');

      // Goal of 100 cards
      schema = createMockSchema({
        daily_goal: { target_cards: 100 },
        today: { reviews_completed: 50, new_cards_introduced: 50 }
      });
      progress = GoalsManager.getGoalProgress(schema);
      assertTrue(progress.isComplete, 'Goal of 100: complete at 100');

      // Final Summary
      summaryDiv.textContent = `Tests Complete: ${passCount} passed, ${failCount} failed`;
      summaryDiv.className = failCount === 0 ? 'summary all-pass' : 'summary has-fail';
    }

    // Run tests on load
    runTests();
  </script>
</body>
</html>
