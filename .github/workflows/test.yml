name: Test Suite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Python Tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: |
          uv run pytest tests/ -v --tb=short

      - name: Run tests with coverage (FS1 scripts)
        run: |
          # Run coverage for FS1 memory scripts
          uv run pytest tests/test_log_session.py tests/test_consolidate_memory.py tests/test_memory_integration.py \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml \
            || true  # Don't fail on coverage warning for non-FS1 scripts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    name: Linting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check Python syntax
        run: |
          uv run python -m py_compile scripts/log-session.py
          uv run python -m py_compile scripts/consolidate-memory.py
