[project]
name = "dbt-playground"
version = "0.2.0"
description = "dbt learning project for data transformation best practices, agent orchestration, and dbt-mcp integration"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.10.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0",
    "pre-commit>=3.7.0",
]
