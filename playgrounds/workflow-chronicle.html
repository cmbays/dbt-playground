<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflow Chronicle - dbt-playground</title>

  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ==================== Design System Tokens ====================
       Philosophy: "Linear calm + Raycast polish + Neobrutalist delight"
       - Base layer: Monochrome, opacity hierarchy, extreme restraint
       - Attention layer: Bold borders, vibrant status colors, springy animations
       ==================== */
    :root {
      /* === BASE LAYER (Monochrome) === */

      /* Background - Near-black foundation */
      --color-bg-primary: #09090b;
      --color-bg-secondary: #0f0f11;
      --color-bg-elevated: #18181b;
      --color-bg-surface: #1c1c1f;

      /* Text - Opacity-based hierarchy */
      --color-text-primary: rgba(255, 255, 255, 0.87);
      --color-text-secondary: rgba(255, 255, 255, 0.60);
      --color-text-muted: rgba(255, 255, 255, 0.38);
      --color-text-disabled: rgba(255, 255, 255, 0.20);
      --color-text-inverse: #000; /* For text on vibrant backgrounds */

      /* Borders - Subtle definition */
      --color-border-subtle: rgba(255, 255, 255, 0.08);
      --color-border-default: rgba(255, 255, 255, 0.12);
      --color-border-strong: rgba(255, 255, 255, 0.20);

      /* === ATTENTION LAYER (Status-Driven) === */

      /* Action - Cyan (primary CTAs, interactive focus) */
      --color-action: #22d3ee;
      --color-action-hover: #06b6d4;
      --color-action-bold: #00e5ff;

      /* Success - Green (completions, confirmations) */
      --color-success: #34d399;
      --color-success-hover: #10b981;
      --color-success-bold: #00ff88;

      /* Error - Red (failures, destructive actions) */
      --color-error: #f87171;
      --color-error-hover: #ef4444;
      --color-error-bold: #ff4444;

      /* Warning - Amber (cautions, pending states) */
      --color-warning: #fbbf24;
      --color-warning-hover: #f59e0b;
      --color-warning-bold: #ffcc00;

      /* Purple - for agent/feature highlighting */
      --color-purple: #a78bfa;
      --color-purple-hover: #8b5cf6;
      --color-purple-bold: #c084fc;

      /* === EFFECTS === */

      /* Glassmorphism (Raycast-inspired) */
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-bg-subtle: rgba(255, 255, 255, 0.03);
      --glass-blur: blur(12px);
      --glass-border: rgba(255, 255, 255, 0.1);

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.3);

      /* Neobrutalist Effects */
      --border-bold: 2px solid;
      --border-brutal: 3px solid;
      --shadow-brutal: 4px 4px 0px;
      --shadow-brutal-sm: 2px 2px 0px;

      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-normal: 200ms ease;
      --transition-spring: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-smooth: 200ms ease-out;

      /* Radii */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* === TYPOGRAPHY === */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;

      /* Type Scale */
      --text-2xs: 0.625rem;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;

      /* Spacing */
      --space-px: 0.125rem;
      --space-1: 0.25rem;
      --space-1-5: 0.375rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;

      /* === COMMIT TYPE COLORS === */
      --color-type-feat: var(--color-success);
      --color-type-fix: var(--color-error);
      --color-type-docs: var(--color-action);
      --color-type-chore: var(--color-text-muted);
      --color-type-test: var(--color-purple);
      --color-type-refactor: var(--color-warning);
    }

    /* ==================== Base Styles ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Reduced motion support */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ==================== Focus States ==================== */
    :focus-visible {
      outline: 2px solid var(--color-action);
      outline-offset: 2px;
    }

    /* ==================== Header ==================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--color-bg-secondary);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--color-border-default);
      padding: var(--space-3) var(--space-6);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .header h1 {
      font-size: var(--text-xl);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      letter-spacing: -0.02em;
    }

    .version-badge {
      background: var(--color-action);
      color: var(--color-text-inverse);
      padding: var(--space-px) var(--space-2);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      gap: var(--space-2);
    }

    /* ==================== Buttons ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text-primary);
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }

    .btn:hover {
      background: var(--color-bg-surface);
      border-color: var(--color-border-strong);
    }

    /* Primary button - Neobrutalist attention-grabbing */
    .btn-primary {
      background: var(--color-action);
      color: var(--color-text-inverse);
      border: var(--border-bold) currentColor;
      font-weight: 600;
      box-shadow: var(--shadow-brutal) var(--color-action-bold);
      transition: all var(--transition-spring);
    }

    .btn-primary:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--color-action-bold);
    }

    .btn-primary:active {
      transform: translate(0, 0);
      box-shadow: 2px 2px 0px var(--color-action-bold);
    }

    /* ==================== Glance Panel (Glass) ==================== */
    .glance-panel {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      padding: var(--space-4) var(--space-6);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-4);
    }

    .glance-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .glance-label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .glance-value {
      font-size: var(--text-xl);
      font-weight: 600;
    }

    .glance-value.health {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .health-bar {
      width: 100px;
      height: 8px;
      background: var(--color-bg-elevated);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .health-fill {
      height: 100%;
      border-radius: var(--radius-sm);
      transition: width var(--transition-spring);
    }

    .health-good { background: var(--color-success); }
    .health-fair { background: var(--color-warning); }
    .health-poor { background: var(--color-error); }

    /* ==================== Main Content ==================== */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==================== Layer Tabs ==================== */
    .layer-tabs {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      background: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border-default);
    }

    .layer-tab {
      padding: var(--space-2) var(--space-3);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--color-text-secondary);
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .layer-tab:hover {
      background: var(--color-bg-elevated);
    }

    .layer-tab.active {
      background: var(--color-action);
      color: var(--color-text-inverse);
      font-weight: 500;
    }

    /* ==================== Timeline Container ==================== */
    .timeline-container {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      padding: var(--space-6);
    }

    .timeline {
      min-width: 100%;
      position: relative;
    }

    /* ==================== Time Axis ==================== */
    .time-axis {
      display: flex;
      gap: 1px;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-2);
      border-bottom: 1px solid var(--color-border-default);
    }

    .time-marker {
      flex: 1;
      min-width: 100px;
      text-align: center;
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* ==================== Commit Layer ==================== */
    .commit-layer {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .commit-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
    }

    .commit-row:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--color-action);
    }

    .commit-time {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      min-width: 50px;
      font-family: var(--font-mono);
    }

    .commit-type {
      padding: var(--space-px) var(--space-2);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 500;
      min-width: 60px;
      text-align: center;
    }

    .type-feat { background: rgba(52, 211, 153, 0.15); color: var(--color-type-feat); }
    .type-fix { background: rgba(248, 113, 113, 0.15); color: var(--color-type-fix); }
    .type-docs { background: rgba(34, 211, 238, 0.15); color: var(--color-type-docs); }
    .type-chore { background: rgba(255, 255, 255, 0.08); color: var(--color-type-chore); }
    .type-test { background: rgba(167, 139, 250, 0.15); color: var(--color-type-test); }
    .type-refactor { background: rgba(251, 191, 36, 0.15); color: var(--color-type-refactor); }
    .type-other { background: var(--color-bg-elevated); color: var(--color-text-secondary); }

    .commit-message {
      flex: 1;
      font-size: var(--text-sm);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .commit-sha {
      font-size: var(--text-xs);
      font-family: var(--font-mono);
      color: var(--color-text-muted);
    }

    .commit-agent {
      font-size: var(--text-xs);
      color: var(--color-purple);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .commit-stats {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      display: flex;
      gap: var(--space-2);
    }

    .stat-add { color: var(--color-success); }
    .stat-del { color: var(--color-error); }

    /* ==================== Branch Layer ==================== */
    .branch-layer {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .branch-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
    }

    .branch-name {
      font-weight: 500;
      min-width: 200px;
    }

    .branch-bar {
      flex: 1;
      height: 8px;
      background: var(--color-action);
      border-radius: var(--radius-sm);
      opacity: 0.6;
    }

    .branch-stats {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* ==================== Insights Panel (Glass) ==================== */
    .insights-panel {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--glass-border);
      padding: var(--space-4) var(--space-6);
    }

    .insights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--space-4);
    }

    .insight-item {
      text-align: center;
    }

    .insight-value {
      font-size: var(--text-2xl);
      font-weight: 700;
      color: var(--color-action);
    }

    .insight-label {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* ==================== Loading State ==================== */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--space-12);
      color: var(--color-text-muted);
    }

    /* ==================== Empty State ==================== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-12);
      color: var(--color-text-muted);
      gap: var(--space-4);
    }

    .empty-state p {
      max-width: 400px;
      text-align: center;
    }

    /* ==================== Decision Layer ==================== */
    .decision-layer {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .decision-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      transition: all var(--transition-fast);
    }

    .decision-card:hover {
      box-shadow: var(--shadow-md);
    }

    .decision-card.answer-no {
      border-left: var(--border-brutal) var(--color-error);
      box-shadow: var(--shadow-brutal-sm) var(--color-error-bold);
    }

    .decision-card.answer-not-yet {
      border-left: var(--border-brutal) var(--color-warning);
      box-shadow: var(--shadow-brutal-sm) var(--color-warning-bold);
    }

    .decision-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: var(--space-4);
      margin-bottom: var(--space-3);
    }

    .decision-id {
      font-size: var(--text-xs);
      font-family: var(--font-mono);
      color: var(--color-text-muted);
    }

    .decision-answer {
      padding: var(--space-px) var(--space-2);
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
    }

    .decision-answer.no {
      background: rgba(248, 113, 113, 0.15);
      color: var(--color-error);
    }

    .decision-answer.not-yet {
      background: rgba(251, 191, 36, 0.15);
      color: var(--color-warning);
    }

    .decision-question {
      font-size: var(--text-base);
      font-weight: 500;
      margin-bottom: var(--space-2);
    }

    .decision-rationale {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-3);
      white-space: pre-line;
      line-height: 1.6;
    }

    .decision-trigger {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      padding: var(--space-2);
      background: var(--color-bg-secondary);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-2);
    }

    .decision-trigger strong {
      color: var(--color-text-secondary);
    }

    .decision-meta {
      display: flex;
      gap: var(--space-4);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      flex-wrap: wrap;
    }

    .decision-meta-item {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .confidence-badge {
      padding: var(--space-px) var(--space-1-5);
      border-radius: var(--radius-sm);
      font-size: var(--text-2xs);
      font-weight: 500;
      text-transform: uppercase;
    }

    .confidence-high {
      background: rgba(52, 211, 153, 0.15);
      color: var(--color-success);
    }

    .confidence-medium {
      background: rgba(251, 191, 36, 0.15);
      color: var(--color-warning);
    }

    .confidence-low {
      background: rgba(248, 113, 113, 0.15);
      color: var(--color-error);
    }

    /* ==================== Footer ==================== */
    .footer {
      background: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border-default);
      padding: var(--space-2) var(--space-6);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>
      Workflow Chronicle
      <span class="version-badge">v1.0</span>
    </h1>
    <div class="header-actions">
      <button class="btn" onclick="loadData()" aria-label="Refresh chronicle data">Refresh</button>
      <button class="btn btn-primary" onclick="exportJSON()" aria-label="Export chronicle data as JSON">Export JSON</button>
    </div>
  </header>

  <section class="glance-panel" id="glance-panel" aria-label="At-a-glance metrics">
    <div class="glance-item">
      <span class="glance-label">Branch</span>
      <span class="glance-value" id="glance-branch">--</span>
    </div>
    <div class="glance-item">
      <span class="glance-label">Phase</span>
      <span class="glance-value" id="glance-phase">--</span>
    </div>
    <div class="glance-item">
      <span class="glance-label">Health</span>
      <div class="glance-value health">
        <span id="glance-health">--</span>
        <div class="health-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Health score: 0 out of 100">
          <div class="health-fill health-good" id="health-fill" style="width: 0%"></div>
        </div>
      </div>
    </div>
    <div class="glance-item">
      <span class="glance-label">Commits</span>
      <span class="glance-value" id="glance-commits">--</span>
    </div>
    <div class="glance-item">
      <span class="glance-label">Agent-Assisted</span>
      <span class="glance-value" id="glance-agent">--</span>
    </div>
  </section>

  <main class="main-content">
    <nav class="layer-tabs" role="tablist" aria-label="Chronicle layers">
      <button class="layer-tab active" data-layer="surface" role="tab" aria-selected="true" aria-controls="timeline-container">Surface (Commits)</button>
      <button class="layer-tab" data-layer="features" role="tab" aria-selected="false" aria-controls="timeline-container">Features (Branches)</button>
      <button class="layer-tab" data-layer="decisions" role="tab" aria-selected="false" aria-controls="timeline-container">Decisions</button>
      <button class="layer-tab" data-layer="bedrock" role="tab" aria-selected="false" aria-controls="timeline-container">Bedrock</button>
    </nav>

    <div class="timeline-container" id="timeline-container" role="tabpanel" aria-label="Timeline content" aria-live="polite">
      <div class="loading" id="loading">Loading chronicle data...</div>
    </div>
  </main>

  <section class="insights-panel" id="insights-panel" aria-label="Insights summary">
    <div class="insights-grid">
      <div class="insight-item">
        <div class="insight-value" id="insight-total">0</div>
        <div class="insight-label">Total Commits</div>
      </div>
      <div class="insight-item">
        <div class="insight-value" id="insight-files">0</div>
        <div class="insight-label">Files Changed</div>
      </div>
      <div class="insight-item">
        <div class="insight-value" id="insight-insertions">0</div>
        <div class="insight-label">Insertions</div>
      </div>
      <div class="insight-item">
        <div class="insight-value" id="insight-deletions">0</div>
        <div class="insight-label">Deletions</div>
      </div>
      <div class="insight-item">
        <div class="insight-value" id="insight-duration">0h</div>
        <div class="insight-label">Duration</div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span id="generated-at">--</span>
    <span>Workflow Chronicle | dbt-playground</span>
  </footer>

  <script>
    // Global data store
    let chronicleData = null;
    let currentLayer = 'surface';

    // Sample data for when no external data is available
    const sampleData = {
      metadata: {
        generated_at: new Date().toISOString(),
        since: "7 days ago",
        version: "1.0.0"
      },
      layers: {
        surface: {
          name: "Commits",
          data: [
            { short_sha: "abc123", timestamp: new Date().toISOString(), message: "feat(staging): add stg_customers model", commit_type: "feat", co_authored_by: ["Claude"], files_changed: 3, insertions: 45, deletions: 0 },
            { short_sha: "def456", timestamp: new Date(Date.now() - 3600000).toISOString(), message: "docs: update README", commit_type: "docs", co_authored_by: [], files_changed: 1, insertions: 10, deletions: 2 },
            { short_sha: "ghi789", timestamp: new Date(Date.now() - 7200000).toISOString(), message: "fix: correct null handling", commit_type: "fix", co_authored_by: ["Claude Opus 4.5"], files_changed: 2, insertions: 5, deletions: 3 },
          ]
        },
        features: {
          name: "Branches",
          data: [
            { name: "main", commit_count: 50, status: "mainline" },
            { name: "feat/customer-analytics", commit_count: 8, status: "active" }
          ]
        },
        decisions: {
          name: "Decisions",
          data: [
            { id: "NS-001", question: "Should we use Snowflake instead of DuckDB?", answer: "NO", date: "2026-01-15", rationale: "Learning project where cost matters. DuckDB is free and local.", reconsidering_trigger: "Data exceeds 10GB OR cloud deployment required", raised_by: "human", confidence: "HIGH", related_feature: null },
            { id: "NS-002", question: "Should we add dbt Cloud?", answer: "NOT_YET", date: "2026-01-20", rationale: "Core workflow is CLI-based with Claude Code.", reconsidering_trigger: "Team grows beyond 3 OR scheduling/orchestration becomes critical", raised_by: "architect", confidence: "MEDIUM", related_feature: null }
          ]
        },
        bedrock: {
          name: "Foundation",
          data: {
            project: "dbt-playground",
            dbt_version: "1.11.2",
            adapter: "duckdb",
            current_milestone: "v0.6.0"
          }
        }
      },
      insights: {
        total_commits: 3,
        total_files_changed: 6,
        total_insertions: 60,
        total_deletions: 5,
        duration_hours: 2,
        agent_contribution_pct: 67,
        commit_types: { feat: 1, docs: 1, fix: 1 }
      },
      events: []
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Check for format=json parameter
      const params = new URLSearchParams(window.location.search);
      if (params.get('format') === 'json') {
        loadData().then(() => {
          document.body.innerHTML = '<pre>' + JSON.stringify(chronicleData || sampleData, null, 2) + '</pre>';
        });
        return;
      }

      // Set up tab switching
      document.querySelectorAll('.layer-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.layer-tab').forEach(t => {
            t.classList.remove('active');
            t.setAttribute('aria-selected', 'false');
          });
          tab.classList.add('active');
          tab.setAttribute('aria-selected', 'true');
          currentLayer = tab.dataset.layer;
          renderLayer();
        });
      });

      loadData();
    });

    // Load data from file or use sample
    async function loadData() {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'flex';

      try {
        const response = await fetch('../temp/WORKFLOW_HISTORY/chronicle-data.json');
        if (response.ok) {
          chronicleData = await response.json();
        } else {
          chronicleData = sampleData;
        }
      } catch (e) {
        chronicleData = sampleData;
      }

      updateGlance();
      updateInsights();
      renderLayer();

      if (loading) loading.style.display = 'none';
      document.getElementById('generated-at').textContent =
        `Generated: ${new Date(chronicleData.metadata.generated_at).toLocaleString()}`;
    }

    // Update glance panel
    function updateGlance() {
      const data = chronicleData.layers.surface.data;
      const insights = chronicleData.insights;

      // Derive branch from most recent commit
      const branch = data.length > 0 ? (data[0].branch || 'main') : 'main';
      document.getElementById('glance-branch').textContent = branch;

      // Derive phase from branch
      let phase = 'MAINLINE';
      if (branch.startsWith('feat/')) phase = 'DEVELOPMENT';
      else if (branch.startsWith('fix/')) phase = 'BUGFIX';
      else if (branch.startsWith('docs/')) phase = 'DOCUMENTATION';
      document.getElementById('glance-phase').textContent = phase;

      // Health placeholder (not computed yet)
      document.getElementById('glance-health').textContent = '--/100';
      document.getElementById('health-fill').style.width = '0%';

      // Commit count
      document.getElementById('glance-commits').textContent = insights.total_commits || 0;

      // Agent percentage
      document.getElementById('glance-agent').textContent =
        `${insights.agent_contribution_pct || 0}%`;
    }

    // Update insights panel
    function updateInsights() {
      const insights = chronicleData.insights;
      document.getElementById('insight-total').textContent = insights.total_commits || 0;
      document.getElementById('insight-files').textContent = insights.total_files_changed || 0;
      document.getElementById('insight-insertions').textContent = `+${insights.total_insertions || 0}`;
      document.getElementById('insight-deletions').textContent = `-${insights.total_deletions || 0}`;
      document.getElementById('insight-duration').textContent = `${insights.duration_hours || 0}h`;
    }

    // Render current layer
    function renderLayer() {
      const container = document.getElementById('timeline-container');

      switch (currentLayer) {
        case 'surface':
          renderCommitLayer(container);
          break;
        case 'features':
          renderBranchLayer(container);
          break;
        case 'decisions':
          renderDecisionsLayer(container);
          break;
        case 'bedrock':
          renderBedrockLayer(container);
          break;
      }
    }

    // Render commit layer
    function renderCommitLayer(container) {
      const commits = chronicleData.layers.surface.data;

      if (commits.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No commits found. Run generate-chronicle-data.py to populate data.</p>
          </div>`;
        return;
      }

      let html = '<div class="commit-layer" role="list">';

      commits.forEach(commit => {
        const time = new Date(commit.timestamp).toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
        const typeClass = `type-${commit.commit_type || 'other'}`;
        const hasAgent = commit.co_authored_by && commit.co_authored_by.length > 0;

        html += `
          <div class="commit-row" role="listitem">
            <span class="commit-time">${time}</span>
            <span class="commit-type ${typeClass}">${commit.commit_type || 'other'}</span>
            <span class="commit-message">${escapeHtml(commit.message)}</span>
            <span class="commit-sha">${commit.short_sha}</span>
            ${hasAgent ? `<span class="commit-agent" aria-label="Agent assisted">${commit.co_authored_by.join(', ')}</span>` : ''}
            <span class="commit-stats">
              <span class="stat-add">+${commit.insertions || 0}</span>
              <span class="stat-del">-${commit.deletions || 0}</span>
            </span>
          </div>`;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    // Render branch layer
    function renderBranchLayer(container) {
      const branches = chronicleData.layers.features.data;

      if (branches.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No branch data available.</p>
          </div>`;
        return;
      }

      let html = '<div class="branch-layer" role="list">';

      branches.forEach(branch => {
        html += `
          <div class="branch-row" role="listitem">
            <span class="branch-name">${escapeHtml(branch.name)}</span>
            <div class="branch-bar" style="max-width: ${Math.min(branch.commit_count * 10, 300)}px" role="presentation"></div>
            <span class="branch-stats">${branch.commit_count} commits</span>
          </div>`;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    // Render decisions layer
    function renderDecisionsLayer(container) {
      const decisions = chronicleData.layers.decisions.data;

      if (!decisions || decisions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>Decisions Layer</h3>
            <p>No decisions recorded yet. Run generate-chronicle-data.py to populate from NEGATIVE_SPACE.yaml.</p>
            <p>This layer captures rejected approaches and deferred questions.</p>
          </div>`;
        return;
      }

      let html = '<div class="decision-layer" role="list">';

      decisions.forEach(decision => {
        const answerClass = decision.answer === 'NO' ? 'no' : 'not-yet';
        const cardClass = decision.answer === 'NO' ? 'answer-no' : 'answer-not-yet';
        const confidenceClass = `confidence-${decision.confidence.toLowerCase()}`;

        html += `
          <article class="decision-card ${cardClass}" role="listitem">
            <div class="decision-header">
              <span class="decision-id">${escapeHtml(decision.id)}</span>
              <span class="decision-answer ${answerClass}">${escapeHtml(decision.answer.replace('_', ' '))}</span>
            </div>
            <div class="decision-question">${escapeHtml(decision.question)}</div>
            <div class="decision-rationale">${escapeHtml(decision.rationale)}</div>
            <div class="decision-trigger">
              <strong>Reconsider when:</strong> ${escapeHtml(decision.reconsidering_trigger)}
            </div>
            <div class="decision-meta">
              <span class="decision-meta-item">
                <span>Date:</span> ${escapeHtml(decision.date)}
              </span>
              <span class="decision-meta-item">
                <span>Raised by:</span> ${escapeHtml(decision.raised_by)}
              </span>
              <span class="decision-meta-item">
                <span class="confidence-badge ${confidenceClass}">${escapeHtml(decision.confidence)}</span>
              </span>
              ${decision.related_feature ? `
              <span class="decision-meta-item">
                <span>Feature:</span> ${escapeHtml(decision.related_feature)}
              </span>` : ''}
            </div>
          </article>`;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    // Render bedrock layer
    function renderBedrockLayer(container) {
      const bedrock = chronicleData.layers.bedrock.data;

      let html = '<div class="branch-layer" role="list">';

      Object.entries(bedrock).forEach(([key, value]) => {
        html += `
          <div class="branch-row" role="listitem">
            <span class="branch-name" style="text-transform: capitalize">${key.replace(/_/g, ' ')}</span>
            <span style="flex: 1; font-family: var(--font-mono)">${escapeHtml(String(value))}</span>
          </div>`;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    // Export JSON
    function exportJSON() {
      const dataStr = JSON.stringify(chronicleData || sampleData, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'chronicle-data.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
