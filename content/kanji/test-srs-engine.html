<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRS Engine Tests - JLPT Mastery Engine</title>
  <style>
    body {
      font-family: monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      max-width: 900px;
    }
    h1 {
      color: #4ec9b0;
      border-bottom: 2px solid #4ec9b0;
      padding-bottom: 10px;
    }
    h2 {
      color: #569cd6;
      margin-top: 30px;
      border-bottom: 1px solid #569cd6;
      padding-bottom: 5px;
    }
    .test {
      margin: 10px 0;
      padding: 8px 10px;
      background: #2d2d30;
      border-left: 3px solid #007acc;
    }
    .pass {
      border-left-color: #4ec9b0;
    }
    .pass::before {
      content: "PASS ";
      color: #4ec9b0;
      font-weight: bold;
    }
    .fail {
      border-left-color: #f48771;
    }
    .fail::before {
      content: "FAIL ";
      color: #f48771;
      font-weight: bold;
    }
    .info {
      color: #9cdcfe;
      margin: 3px 0 3px 20px;
      font-size: 0.9em;
    }
    .summary {
      margin-top: 30px;
      padding: 15px;
      background: #2d2d30;
      border: 2px solid #4ec9b0;
    }
    .summary.has-failures {
      border-color: #f48771;
    }
    code {
      background: #1e1e1e;
      padding: 2px 6px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>SRS Engine Test Suite</h1>
  <p>Testing SM-2 algorithm implementation per TDD-001 3, 4, 7.2</p>

  <script src="js/srs-engine.js"></script>

  <script>
    // Test framework utilities
    const results = [];

    function test(name, fn) {
      try {
        fn();
        results.push({ name, passed: true });
        return true;
      } catch (e) {
        results.push({ name, passed: false, error: e.message });
        return false;
      }
    }

    function expect(actual) {
      return {
        toBe(expected) {
          if (actual !== expected) {
            throw new Error(`Expected ${expected}, got ${actual}`);
          }
        },
        toBeCloseTo(expected, precision = 2) {
          const multiplier = Math.pow(10, precision);
          if (Math.round(actual * multiplier) !== Math.round(expected * multiplier)) {
            throw new Error(`Expected ~${expected}, got ${actual}`);
          }
        },
        toBeGreaterThan(expected) {
          if (actual <= expected) {
            throw new Error(`Expected ${actual} > ${expected}`);
          }
        },
        toBeLessThan(expected) {
          if (actual >= expected) {
            throw new Error(`Expected ${actual} < ${expected}`);
          }
        },
        toBeGreaterThanOrEqual(expected) {
          if (actual < expected) {
            throw new Error(`Expected ${actual} >= ${expected}`);
          }
        },
        toBeLessThanOrEqual(expected) {
          if (actual > expected) {
            throw new Error(`Expected ${actual} <= ${expected}`);
          }
        },
        toEqual(expected) {
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
          }
        },
        toBeTruthy() {
          if (!actual) {
            throw new Error(`Expected truthy, got ${actual}`);
          }
        },
        toBeFalsy() {
          if (actual) {
            throw new Error(`Expected falsy, got ${actual}`);
          }
        }
      };
    }

    // Create a test kanji progress object
    function createTestKanji(overrides = {}) {
      const srsDefaults = {
        stage: 'apprentice_1',
        interval_days: 1,
        ease_factor: 2.5,
        repetitions: 0,
        last_reviewed: null,
        next_review_date: null,
        total_reviews: 0,
        correct_count: 0,
        is_new: false,
        introduced_at: new Date().toISOString()
      };

      return {
        character: '',
        jlpt_level: 'N5',
        topics: ['home-life'],
        srs: { ...srsDefaults, ...(overrides.srs || {}) },
        history: overrides.history || []
      };
    }

    console.log('=== SRS Engine Tests ===\n');

    // =========================================================================
    // SM-2 INTERVAL TESTS (TDD 7.2)
    // =========================================================================

    console.log('\n--- SM-2 Interval Tests ---\n');

    test('SM-2 Interval: First Success (rep=0) -> 1 day', () => {
      const srs = { interval_days: 0, ease_factor: 2.5, repetitions: 0 };
      const result = SRSEngine.calculateNextInterval(srs, 4);
      expect(result.interval_days).toBe(1);
      expect(result.repetitions).toBe(1);
      console.log('  First success: 0 days -> 1 day');
    });

    test('SM-2 Interval: Second Success (rep=1) -> 6 days', () => {
      const srs = { interval_days: 1, ease_factor: 2.5, repetitions: 1 };
      const result = SRSEngine.calculateNextInterval(srs, 4);
      expect(result.interval_days).toBe(6);
      expect(result.repetitions).toBe(2);
      console.log('  Second success: 1 day -> 6 days');
    });

    test('SM-2 Interval: Third Success (rep=2) -> interval * EF', () => {
      const srs = { interval_days: 6, ease_factor: 2.5, repetitions: 2 };
      const result = SRSEngine.calculateNextInterval(srs, 4);
      // 6 * 2.5 = 15, but EF changes slightly with quality 4
      expect(result.interval_days).toBe(15);
      expect(result.repetitions).toBe(3);
      console.log('  Third success: 6 days * EF -> 15 days');
    });

    test('SM-2 Interval: Failure (quality=0) -> 1 day, reset reps', () => {
      const srs = { interval_days: 30, ease_factor: 2.5, repetitions: 5 };
      const result = SRSEngine.calculateNextInterval(srs, 0);
      expect(result.interval_days).toBe(1);
      expect(result.repetitions).toBe(0);
      console.log('  Failure: 30 days -> 1 day, reps reset to 0');
    });

    // =========================================================================
    // SM-2 EASE FACTOR TESTS (TDD 7.2)
    // =========================================================================

    console.log('\n--- SM-2 Ease Factor Tests ---\n');

    test('SM-2 EF: Quality 5 increases EF', () => {
      const srs = { interval_days: 6, ease_factor: 2.5, repetitions: 2 };
      const result = SRSEngine.calculateNextInterval(srs, 5);
      // EF adjustment for q=5: 0.1 - (5-5) * (0.08 + 0) = 0.1
      // New EF = 2.5 + 0.1 = 2.6
      expect(result.ease_factor).toBeCloseTo(2.6, 2);
      console.log('  Quality 5: EF 2.5 -> ~2.6');
    });

    test('SM-2 EF: Quality 4 slightly decreases EF', () => {
      const srs = { interval_days: 6, ease_factor: 2.5, repetitions: 2 };
      const result = SRSEngine.calculateNextInterval(srs, 4);
      // EF adjustment for q=4: 0.1 - (5-4) * (0.08 + (5-4) * 0.02)
      //                      = 0.1 - 1 * (0.08 + 0.02) = 0.1 - 0.1 = 0
      expect(result.ease_factor).toBeCloseTo(2.5, 2);
      console.log('  Quality 4: EF 2.5 -> ~2.5 (no change)');
    });

    test('SM-2 EF: Quality 2 decreases EF', () => {
      const srs = { interval_days: 6, ease_factor: 2.5, repetitions: 2 };
      const result = SRSEngine.calculateNextInterval(srs, 2);
      // EF adjustment for q=2: 0.1 - (5-2) * (0.08 + (5-2) * 0.02)
      //                      = 0.1 - 3 * (0.08 + 0.06) = 0.1 - 0.42 = -0.32
      // New EF = 2.5 - 0.32 = 2.18
      expect(result.ease_factor).toBeCloseTo(2.18, 2);
      console.log('  Quality 2: EF 2.5 -> ~2.18');
    });

    test('SM-2 EF: Quality 0 significantly decreases EF', () => {
      const srs = { interval_days: 6, ease_factor: 2.5, repetitions: 2 };
      const result = SRSEngine.calculateNextInterval(srs, 0);
      // EF adjustment for q=0: 0.1 - (5-0) * (0.08 + (5-0) * 0.02)
      //                      = 0.1 - 5 * (0.08 + 0.1) = 0.1 - 0.9 = -0.8
      // New EF = 2.5 - 0.8 = 1.7
      expect(result.ease_factor).toBeCloseTo(1.7, 2);
      console.log('  Quality 0: EF 2.5 -> ~1.7');
    });

    test('SM-2 EF: Min clamp at 1.3', () => {
      const srs = { interval_days: 6, ease_factor: 1.4, repetitions: 2 };
      const result = SRSEngine.calculateNextInterval(srs, 0);
      // EF would go to 1.4 - 0.8 = 0.6, but clamped to 1.3
      expect(result.ease_factor).toBe(1.3);
      console.log('  Min clamp: EF clamped to 1.3');
    });

    test('SM-2 EF: Max clamp at 5.0', () => {
      const srs = { interval_days: 6, ease_factor: 4.95, repetitions: 2 };
      const result = SRSEngine.calculateNextInterval(srs, 5);
      // EF would go to 4.95 + 0.1 = 5.05, but clamped to 5.0
      expect(result.ease_factor).toBe(5.0);
      console.log('  Max clamp: EF clamped to 5.0');
    });

    // =========================================================================
    // STAGE TRANSITION TESTS (TDD 4.2, 7.2)
    // =========================================================================

    console.log('\n--- Stage Transition Tests ---\n');

    test('Stage: GOOD from lesson -> apprentice_1', () => {
      const newStage = SRSEngine.updateStage('lesson', 4);
      expect(newStage).toBe('apprentice_1');
      console.log('  GOOD: lesson -> apprentice_1');
    });

    test('Stage: EASY from apprentice_1 -> apprentice_2', () => {
      const newStage = SRSEngine.updateStage('apprentice_1', 5);
      expect(newStage).toBe('apprentice_2');
      console.log('  EASY: apprentice_1 -> apprentice_2');
    });

    test('Stage: HARD from apprentice_2 -> apprentice_1', () => {
      const newStage = SRSEngine.updateStage('apprentice_2', 2);
      expect(newStage).toBe('apprentice_1');
      console.log('  HARD: apprentice_2 -> apprentice_1 (-1)');
    });

    test('Stage: AGAIN from apprentice_2 -> apprentice_1 (floor)', () => {
      const newStage = SRSEngine.updateStage('apprentice_2', 0);
      expect(newStage).toBe('apprentice_1');
      console.log('  AGAIN: apprentice_2 -> apprentice_1 (floor, would be -2)');
    });

    test('Stage: AGAIN from guru_1 -> apprentice_3 (-2 stages)', () => {
      const newStage = SRSEngine.updateStage('guru_1', 0);
      expect(newStage).toBe('apprentice_3');
      console.log('  AGAIN: guru_1 -> apprentice_3 (-2 stages)');
    });

    test('Stage: HARD from guru_1 -> apprentice_4 (-1 stage)', () => {
      const newStage = SRSEngine.updateStage('guru_1', 2);
      expect(newStage).toBe('apprentice_4');
      console.log('  HARD: guru_1 -> apprentice_4 (-1 stage)');
    });

    test('Stage: AGAIN from apprentice_1 -> apprentice_1 (floor)', () => {
      const newStage = SRSEngine.updateStage('apprentice_1', 0);
      expect(newStage).toBe('apprentice_1');
      console.log('  AGAIN: apprentice_1 stays at apprentice_1 (floor)');
    });

    test('Stage: GOOD from enlightened -> burned', () => {
      const newStage = SRSEngine.updateStage('enlightened', 4);
      expect(newStage).toBe('burned');
      console.log('  GOOD: enlightened -> burned');
    });

    test('Stage: Burned stays burned (no regression)', () => {
      const newStage = SRSEngine.updateStage('burned', 0);
      expect(newStage).toBe('burned');
      console.log('  AGAIN on burned: stays burned');
    });

    test('Stage: Locked stays locked', () => {
      const newStage = SRSEngine.updateStage('locked', 4);
      expect(newStage).toBe('locked');
      console.log('  Locked cannot be reviewed');
    });

    // =========================================================================
    // PROCESS REVIEW INTEGRATION TESTS
    // =========================================================================

    console.log('\n--- processReview Integration Tests ---\n');

    test('processReview: Updates all SRS fields correctly', () => {
      const kanji = createTestKanji({
        srs: {
          stage: 'apprentice_1',
          interval_days: 0.333,
          ease_factor: 2.5,
          repetitions: 0,
          total_reviews: 0,
          correct_count: 0
        }
      });

      const updated = SRSEngine.processReview(kanji, 4);

      expect(updated.srs.stage).toBe('apprentice_2');
      expect(updated.srs.interval_days).toBe(1);
      expect(updated.srs.repetitions).toBe(1);
      expect(updated.srs.total_reviews).toBe(1);
      expect(updated.srs.correct_count).toBe(1);
      expect(updated.srs.last_reviewed).toBeTruthy();
      expect(updated.srs.next_review_date).toBeTruthy();
      console.log('  All SRS fields updated correctly');
    });

    test('processReview: Adds history entry', () => {
      const kanji = createTestKanji({ srs: { stage: 'apprentice_2' } });
      const updated = SRSEngine.processReview(kanji, 4);

      expect(updated.history.length).toBe(1);
      expect(updated.history[0].quality).toBe(4);
      expect(updated.history[0].stage_before).toBe('apprentice_2');
      expect(updated.history[0].stage_after).toBe('apprentice_3');
      console.log('  History entry added with correct data');
    });

    test('processReview: Caps history at 50 entries', () => {
      const existingHistory = Array(55).fill(null).map((_, i) => ({
        timestamp: new Date(Date.now() - i * 1000).toISOString(),
        quality: 4,
        stage_before: 'apprentice_1',
        stage_after: 'apprentice_2'
      }));

      const kanji = createTestKanji({
        srs: { stage: 'apprentice_2' },
        history: existingHistory
      });

      const updated = SRSEngine.processReview(kanji, 4);
      expect(updated.history.length).toBe(50);
      console.log('  History capped at 50 entries');
    });

    test('processReview: Handles new card (is_new=true)', () => {
      const kanji = createTestKanji({
        srs: {
          stage: 'locked',
          is_new: true,
          introduced_at: null
        }
      });

      const updated = SRSEngine.processReview(kanji, 4);
      expect(updated.srs.is_new).toBe(false);
      expect(updated.srs.introduced_at).toBeTruthy();
      expect(updated.srs.stage).toBe('apprentice_1');
      console.log('  New card properly initialized');
    });

    test('processReview: Includes response time if provided', () => {
      const kanji = createTestKanji();
      const updated = SRSEngine.processReview(kanji, 4, 3200);

      expect(updated.history[0].response_time_ms).toBe(3200);
      console.log('  Response time included in history');
    });

    test('processReview: Returns new object (immutable)', () => {
      const kanji = createTestKanji();
      const updated = SRSEngine.processReview(kanji, 4);

      expect(kanji).toBeTruthy();
      expect(updated).toBeTruthy();
      expect(kanji !== updated).toBeTruthy();
      expect(kanji.srs !== updated.srs).toBeTruthy();
      console.log('  Returns new object (immutable pattern)');
    });

    // =========================================================================
    // HELPER FUNCTION TESTS
    // =========================================================================

    console.log('\n--- Helper Function Tests ---\n');

    test('getStageMasteryScore: Returns correct scores', () => {
      expect(SRSEngine.getStageMasteryScore('locked')).toBe(0);
      expect(SRSEngine.getStageMasteryScore('lesson')).toBe(10);
      expect(SRSEngine.getStageMasteryScore('guru_1')).toBe(60);
      expect(SRSEngine.getStageMasteryScore('burned')).toBe(100);
      console.log('  Stage mastery scores correct');
    });

    test('isDue: Identifies due cards correctly', () => {
      const pastDate = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
      const futureDate = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();

      const dueKanji = createTestKanji({
        srs: { stage: 'apprentice_2', next_review_date: pastDate }
      });
      const notDueKanji = createTestKanji({
        srs: { stage: 'apprentice_2', next_review_date: futureDate }
      });
      const lockedKanji = createTestKanji({ srs: { stage: 'locked' } });
      const burnedKanji = createTestKanji({ srs: { stage: 'burned' } });

      expect(SRSEngine.isDue(dueKanji)).toBe(true);
      expect(SRSEngine.isDue(notDueKanji)).toBe(false);
      expect(SRSEngine.isDue(lockedKanji)).toBe(false);
      expect(SRSEngine.isDue(burnedKanji)).toBe(false);
      console.log('  isDue correctly identifies due/not due cards');
    });

    test('unlockKanji: Moves locked to lesson', () => {
      const kanji = createTestKanji({ srs: { stage: 'locked' } });
      const unlocked = SRSEngine.unlockKanji(kanji);

      expect(unlocked.srs.stage).toBe('lesson');
      expect(unlocked.srs.is_new).toBe(true);
      expect(unlocked.srs.introduced_at).toBeTruthy();
      console.log('  unlockKanji moves locked -> lesson');
    });

    test('getStageIndex: Returns correct indices', () => {
      expect(SRSEngine.getStageIndex('locked')).toBe(0);
      expect(SRSEngine.getStageIndex('lesson')).toBe(1);
      expect(SRSEngine.getStageIndex('burned')).toBe(10);
      expect(SRSEngine.getStageIndex('invalid')).toBe(-1);
      console.log('  Stage indices correct');
    });

    test('isHigherStage: Compares stages correctly', () => {
      expect(SRSEngine.isHigherStage('guru_1', 'apprentice_4')).toBe(true);
      expect(SRSEngine.isHigherStage('apprentice_1', 'guru_1')).toBe(false);
      expect(SRSEngine.isHigherStage('burned', 'enlightened')).toBe(true);
      console.log('  Stage comparison correct');
    });

    // =========================================================================
    // SUMMARY
    // =========================================================================

    console.log('\n=== Test Summary ===\n');

    const passed = results.filter(r => r.passed).length;
    const failed = results.filter(r => !r.passed).length;
    const total = results.length;

    console.log(`Passed: ${passed}/${total}`);
    console.log(`Failed: ${failed}/${total}`);

    if (failed > 0) {
      console.log('\nFailed tests:');
      results.filter(r => !r.passed).forEach(r => {
        console.log(`  - ${r.name}: ${r.error}`);
      });
    }

    // Render results to page
    const container = document.createElement('div');

    // Group tests by category
    const categories = {
      'SM-2 Interval': [],
      'SM-2 Ease Factor': [],
      'Stage Transition': [],
      'processReview': [],
      'Helper Functions': []
    };

    results.forEach(r => {
      if (r.name.includes('Interval')) categories['SM-2 Interval'].push(r);
      else if (r.name.includes('EF')) categories['SM-2 Ease Factor'].push(r);
      else if (r.name.includes('Stage')) categories['Stage Transition'].push(r);
      else if (r.name.includes('processReview')) categories['processReview'].push(r);
      else categories['Helper Functions'].push(r);
    });

    Object.entries(categories).forEach(([category, tests]) => {
      if (tests.length === 0) return;

      const section = document.createElement('div');
      section.innerHTML = `<h2>${category}</h2>`;

      tests.forEach(t => {
        const div = document.createElement('div');
        div.className = `test ${t.passed ? 'pass' : 'fail'}`;
        div.innerHTML = t.name;
        if (!t.passed) {
          div.innerHTML += `<div class="info">Error: ${t.error}</div>`;
        }
        section.appendChild(div);
      });

      container.appendChild(section);
    });

    // Summary
    const summary = document.createElement('div');
    summary.className = `summary ${failed > 0 ? 'has-failures' : ''}`;
    summary.innerHTML = `
      <strong style="color: ${failed > 0 ? '#f48771' : '#4ec9b0'}">
        ${failed > 0 ? 'SOME TESTS FAILED' : 'ALL TESTS PASSED'}
      </strong>
      <div class="info">Passed: ${passed}/${total}</div>
      <div class="info">Failed: ${failed}/${total}</div>
    `;
    container.appendChild(summary);

    document.body.appendChild(container);
  </script>
</body>
</html>
