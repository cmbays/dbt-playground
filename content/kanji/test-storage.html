<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage Module Tests - JLPT Mastery Engine</title>
  <style>
    body {
      font-family: monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      max-width: 800px;
    }
    h1 {
      color: #4ec9b0;
      border-bottom: 2px solid #4ec9b0;
      padding-bottom: 10px;
    }
    .test {
      margin: 15px 0;
      padding: 10px;
      background: #2d2d30;
      border-left: 3px solid #007acc;
    }
    .pass {
      border-left-color: #4ec9b0;
      color: #4ec9b0;
    }
    .fail {
      border-left-color: #f48771;
      color: #f48771;
    }
    .info {
      color: #9cdcfe;
      margin: 5px 0;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>🧪 Storage Module Test Suite</h1>

  <script src="js/storage.js"></script>
  <script src="data/kanji-metadata.js"></script>

  <script>
    console.log('=== Storage Module Tests ===\n');

    // Test 1: Create default schema
    console.log('Test 1: Create default schema');
    const schema = createDefaultSchema();
    const test1 = schema && schema.version === '1.0.0' && schema.kanji;
    console.log(`  Result: ${test1 ? '✓ PASS' : '✗ FAIL'}`);
    console.log(`  Schema version: ${schema.version}`);
    console.log(`  Kanji count: ${Object.keys(schema.kanji).length}`);

    // Test 2: Validate default schema
    console.log('\nTest 2: Validate default schema');
    const validation = validateSchema(schema);
    const test2 = validation.valid;
    console.log(`  Result: ${test2 ? '✓ PASS' : '✗ FAIL'}`);
    if (!test2) {
      console.log(`  Errors: ${validation.errors.join(', ')}`);
    }

    // Test 3: Initialize with kanji data
    console.log('\nTest 3: Initialize with kanji metadata');
    if (typeof homeLifeKanji !== 'undefined') {
      try {
        const initializedSchema = createDefaultSchema();

        // Add kanji to schema
        for (const kanjiData of homeLifeKanji) {
          initializedSchema.kanji[kanjiData.character] = {
            character: kanjiData.character,
            jlpt_level: kanjiData.jlpt,
            topics: kanjiData.topics,
            srs: {
              stage: 'locked',
              interval_days: 0,
              ease_factor: 2.5,
              repetitions: 0,
              last_reviewed: null,
              next_review_date: null,
              total_reviews: 0,
              correct_count: 0,
              is_new: true,
              introduced_at: null
            },
            history: []
          };
        }

        const test3 = Object.keys(initializedSchema.kanji).length === homeLifeKanji.length;
        console.log(`  Result: ${test3 ? '✓ PASS' : '✗ FAIL'}`);
        console.log(`  Kanji loaded: ${Object.keys(initializedSchema.kanji).length}`);

        // Check JLPT distribution
        const n5 = Object.values(initializedSchema.kanji).filter(k => k.jlpt_level === 'N5').length;
        const n4 = Object.values(initializedSchema.kanji).filter(k => k.jlpt_level === 'N4').length;
        const n3 = Object.values(initializedSchema.kanji).filter(k => k.jlpt_level === 'N3').length;
        const n2 = Object.values(initializedSchema.kanji).filter(k => k.jlpt_level === 'N2').length;
        console.log(`  N5: ${n5}, N4: ${n4}, N3: ${n3}, N2: ${n2}`);
      } catch (e) {
        console.log(`  Result: ✗ FAIL - ${e.message}`);
      }
    } else {
      console.log(`  Result: ⚠ SKIP - homeLifeKanji not loaded`);
    }

    // Test 4: Validate kanji progress object
    console.log('\nTest 4: Validate kanji progress object');
    const sampleProgress = {
      character: '日',
      jlpt_level: 'N5',
      topics: ['home-life'],
      srs: {
        stage: 'lesson',
        interval_days: 0.167,
        ease_factor: 2.5,
        repetitions: 0,
        last_reviewed: new Date().toISOString(),
        next_review_date: new Date(Date.now() + 4*60*60*1000).toISOString(),
        total_reviews: 1,
        correct_count: 0,
        is_new: false,
        introduced_at: new Date().toISOString()
      },
      history: []
    };

    const progressValidation = validateKanjiProgress(sampleProgress, '日');
    const test4 = progressValidation.valid;
    console.log(`  Result: ${test4 ? '✓ PASS' : '✗ FAIL'}`);
    if (!test4) {
      console.log(`  Errors: ${progressValidation.errors.join(', ')}`);
    }

    // Test 5: Validate SRS state
    console.log('\nTest 5: Validate SRS state');
    const srsValidation = validateSRSState(sampleProgress.srs);
    const test5 = srsValidation.valid;
    console.log(`  Result: ${test5 ? '✓ PASS' : '✗ FAIL'}`);
    if (!test5) {
      console.log(`  Errors: ${srsValidation.errors.join(', ')}`);
    }

    // Test 6: Calculate storage size estimate
    console.log('\nTest 6: Estimate storage usage');
    if (typeof homeLifeKanji !== 'undefined') {
      const estimatedBytes = JSON.stringify(initializedSchema).length;
      const estimatedMB = (estimatedBytes / 1024 / 1024).toFixed(2);
      console.log(`  Schema size: ${estimatedBytes} bytes (~${estimatedMB} MB)`);
      console.log(`  Within limits: ${estimatedBytes < 5000000 ? '✓ PASS' : '✗ FAIL'} (5 MB limit)`);
    }

    // Summary
    console.log('\n=== Test Summary ===');
    const results = [test1, test2, test3, test4, test5];
    const passed = results.filter(r => r).length;
    const total = results.length;
    console.log(`Passed: ${passed}/${total}`);
    console.log(`Status: ${passed === total ? '✓ ALL TESTS PASSED' : '✗ SOME TESTS FAILED'}`);

    // Display in page
    document.body.innerHTML = `
      <h1>🧪 Storage Module Test Suite</h1>
      <div class="test ${test1 ? 'pass' : 'fail'}">
        <strong>Test 1: Create Default Schema</strong>
        <div class="info">Result: ${test1 ? '✓ PASS' : '✗ FAIL'}</div>
        <div class="info">Schema version: ${schema.version}</div>
      </div>
      <div class="test ${test2 ? 'pass' : 'fail'}">
        <strong>Test 2: Validate Default Schema</strong>
        <div class="info">Result: ${test2 ? '✓ PASS' : '✗ FAIL'}</div>
      </div>
      <div class="test ${test3 ? 'pass' : 'fail'}">
        <strong>Test 3: Initialize with Kanji Metadata</strong>
        <div class="info">Result: ${test3 ? '✓ PASS' : '✗ FAIL'}</div>
        <div class="info">Kanji loaded: ${Object.keys(initializedSchema.kanji).length}</div>
      </div>
      <div class="test ${test4 ? 'pass' : 'fail'}">
        <strong>Test 4: Validate Kanji Progress</strong>
        <div class="info">Result: ${test4 ? '✓ PASS' : '✗ FAIL'}</div>
      </div>
      <div class="test ${test5 ? 'pass' : 'fail'}">
        <strong>Test 5: Validate SRS State</strong>
        <div class="info">Result: ${test5 ? '✓ PASS' : '✗ FAIL'}</div>
      </div>
      <div style="margin-top: 20px; padding: 10px; background: #2d2d30; border: 2px solid #4ec9b0;">
        <strong style="color: #4ec9b0;">Summary</strong>
        <div class="info">Passed: ${passed}/${total}</div>
        <div class="info">Status: ${passed === total ? '✓ ALL TESTS PASSED' : '✗ SOME TESTS FAILED'}</div>
      </div>
    `;
  </script>
</body>
</html>
